<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <link rel="stylesheet" href="../../css/editor-wang.css">
    <title>公告编辑</title>
    <style>
        html, body {
            height: 100%;
        }

        body {
            overflow-y: auto;
            background: #fafbfc;
        }

        .yaya-box-fluid {
            padding-bottom: 24px;
        }

        .notice-form-card {
            margin-top: 12px;
            padding: 4px 20px 18px;
            background: var(--yaya-card);
            border: 1px solid var(--yaya-card-border);
            border-radius: var(--yaya-radius-lg);
            box-shadow: var(--yaya-shadow);
        }

        .notice-form-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 0 12px;
            margin-bottom: 4px;
            border-bottom: 1px dashed var(--yaya-border);
        }

        .notice-form-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--yaya-text-1);
        }

        .notice-form-card-title::before {
            content: '';
            width: 3px;
            height: 14px;
            border-radius: 2px;
            background: var(--yaya-primary);
        }

        .notice-form-card-sub {
            font-size: 12px;
            color: var(--yaya-text-4);
        }

        .layui-form-label {
            width: 90px;
            padding: 9px 10px 9px 0;
            color: var(--yaya-text-2);
        }

        .layui-input-block {
            margin-left: 100px;
        }

        .yaya-form-hint {
            margin-top: 4px;
            font-size: 12px;
            color: var(--yaya-text-4);
            line-height: 18px;
        }

        .yaya-required {
            color: var(--yaya-danger);
            margin-right: 2px;
        }

        .notice-form-grid {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -6px;
        }

        .notice-form-grid > .layui-col-sm6 {
            width: 50%;
            padding: 0 6px;
            box-sizing: border-box;
        }

        .notice-form-grid > .layui-col-xs12 {
            width: 100%;
            padding: 0 6px;
            box-sizing: border-box;
        }

        .editor-shell {
            border: 1px solid var(--yaya-border);
            border-radius: var(--yaya-radius-md);
            overflow: hidden;
        }

        #editorToolbar {
            border-bottom: 1px solid var(--yaya-border);
            background: var(--yaya-gray-100);
        }

        #editorContent {
            height: 360px;
            overflow-y: hidden;
            background: #fff;
        }

        .editor-shell .w-e-text-container {
            height: 100%;
        }

        .editor-shell .w-e-toolbar {
            background: var(--yaya-gray-100);
        }

        #deptSelect .xm-select,
        #userSelect .xm-select {
            width: 100%;
            min-height: 38px;
            border-radius: var(--yaya-radius-md);
        }

        .scope-panel {
            display: none;
            padding-top: 4px;
        }

        .scope-panel.is-show {
            display: block;
        }

        .published-scope-tip {
            display: none;
            margin-top: 6px;
            padding: 7px 10px;
            border-radius: var(--yaya-radius-sm);
            background: var(--yaya-warning-bg);
            color: var(--yaya-warning);
            font-size: 12px;
            line-height: 18px;
        }

        .published-scope-tip.is-show {
            display: block;
        }

        .attachment-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .attachment-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .attachment-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border: 1px solid var(--yaya-border);
            border-radius: var(--yaya-radius-md);
            background: var(--yaya-gray-100);
            font-size: 13px;
            color: var(--yaya-text-2);
        }

        .attachment-item .attachment-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .attachment-item .attachment-remove {
            color: var(--yaya-danger);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .attachment-empty {
            margin-top: 8px;
            font-size: 12px;
            color: var(--yaya-text-4);
        }

        .notice-form-actions {
            position: sticky;
            bottom: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
            padding: 12px 10px 14px;
            background: rgba(250, 251, 252, .96);
            border-top: 1px solid var(--yaya-border);
            backdrop-filter: blur(4px);
        }

        .notice-form-actions .yaya-btn {
            min-width: 96px;
        }

        .yaya-btn.is-loading {
            opacity: .65;
            cursor: wait;
        }

        @media (max-width: 767px) {
            .notice-form-card {
                padding-left: 14px;
                padding-right: 14px;
            }

            .notice-form-grid > .layui-col-sm6 {
                width: 100%;
            }

            .layui-form-label {
                width: 82px;
            }

            .layui-input-block {
                margin-left: 92px;
            }
        }
    </style>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="layui-fluid">
        <form class="layui-form" lay-filter="noticeForm">
            <input type="hidden" name="noticeId">
            <div class="notice-form-card">
                <div class="notice-form-card-head">
                    <div class="notice-form-card-title">公告信息</div>
                    <div class="notice-form-card-sub" id="noticeMeta">公告信息加载中...</div>
                </div>
                <div class="notice-form-grid">
                    <div class="layui-col-xs12">
                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="yaya-required">*</span>公告标题</label>
                            <div class="layui-input-block">
                                <input type="text" name="noticeTitle" lay-verify="required" maxlength="200"
                                       lay-reqtext="请输入公告标题" placeholder="请输入公告标题"
                                       autocomplete="off" class="layui-input">
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="yaya-required">*</span>公告类型</label>
                            <div class="layui-input-block">
                                <select name="noticeTypeId" id="noticeTypeId"></select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="yaya-required">*</span>公告级别</label>
                            <div class="layui-input-block">
                                <select name="noticeLevel">
                                    <option value="0">普通</option>
                                    <option value="1">重要</option>
                                    <option value="2">紧急</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="notice-form-card">
                <div class="notice-form-card-head">
                    <div class="notice-form-card-title">公告内容</div>
                    <div class="notice-form-card-sub">支持富文本、图片、视频、表格等内容</div>
                </div>
                <div class="layui-form-item" style="margin-top: 14px;">
                    <div class="editor-shell">
                        <div id="editorToolbar"></div>
                        <div id="editorContent"></div>
                    </div>
                </div>
            </div>

            <div class="notice-form-card">
                <div class="notice-form-card-head">
                    <div class="notice-form-card-title">发布设置</div>
                    <div class="notice-form-card-sub">部门范围按选中的部门精确匹配</div>
                </div>
                <div class="notice-form-grid">
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="yaya-required">*</span>发布范围</label>
                            <div class="layui-input-block">
                                <select name="publishScope" id="publishScope" lay-filter="publishScope">
                                    <option value="1">全员</option>
                                    <option value="2">指定部门</option>
                                    <option value="3">指定用户</option>
                                </select>
                                <div class="published-scope-tip" id="publishedScopeTip">
                                    公告已发布，接收范围不可修改；可以继续修改标题、内容、类型、附件和置顶状态。
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">置顶</label>
                            <div class="layui-input-block">
                                <select name="isTop">
                                    <option value="0">否</option>
                                    <option value="1">是</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 scope-panel" id="deptPanel">
                        <div class="layui-form-item">
                            <label class="layui-form-label">指定部门</label>
                            <div class="layui-input-block">
                                <div id="deptSelect"></div>
                                <div class="yaya-form-hint">选中部门下的正常用户将收到公告，不自动包含子部门</div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 scope-panel" id="userPanel">
                        <div class="layui-form-item">
                            <label class="layui-form-label">指定用户</label>
                            <div class="layui-input-block">
                                <div id="userSelect"></div>
                                <div class="yaya-form-hint">输入用户名或昵称搜索，支持多选</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="notice-form-card">
                <div class="notice-form-card-head">
                    <div class="notice-form-card-title">附件</div>
                    <div class="notice-form-card-sub">最多 20 个附件</div>
                </div>
                <div class="layui-form-item" style="margin-top: 14px;">
                    <div class="layui-input-block" style="margin-left:0;">
                        <div class="attachment-actions">
                            <button type="button" id="btnUploadAttachment" data-perm="file:upload" class="yaya-btn is-plain-primary">
                                <i class="layui-icon layui-icon-upload-drag" style="margin-right: 4px;"></i>上传附件
                            </button>
                            <input type="file" id="attachmentFileInput" multiple style="display:none;">
                            <span class="yaya-form-hint" style="margin-top:0;">公告保存前可移除已上传附件</span>
                        </div>
                        <div id="attachmentList" class="attachment-list"></div>
                        <div id="attachmentEmpty" class="attachment-empty">暂无附件</div>
                    </div>
                </div>
            </div>

            <div class="notice-form-actions">
                <button type="button" class="yaya-btn" id="btnCancel">取消</button>
                <button type="button" id="btnSave" data-perm="notice:update" class="yaya-btn yaya-primary is-loading"
                        lay-submit lay-filter="save" disabled>信息加载中...</button>
            </div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script src="../../js/xm-select.js"></script>
<script src="../../js/editor-wang.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const layer = layui.layer;
        const form = layui.form;

        const PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue('--yaya-primary').trim() || '#409eff';
        const BASE_URL = server_url + '/system/notice';
        const MAX_ATTACHMENTS = 20;
        const noticeId = new URLSearchParams(location.search).get('noticeId');

        let editor = null;
        let detail = null;
        let deptSelect = null;
        let userSelect = null;
        let deptData = [];
        let attachments = [];
        let published = false;
        const loaded = {types: false, depts: false, detail: false, users: false};

        function closeSelf() {
            if (parent && parent.layer && parent.layer.getFrameIndex) {
                const index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                return;
            }
            layer.closeAll();
        }

        function finish(message) {
            if (parent && parent.layer && parent.layer.msg) {
                parent.layer.msg(message);
            } else {
                layer.msg(message);
            }
            closeSelf();
        }

        function loadFailed(name) {
            layer.msg(name + '数据加载失败，请重新打开页面');
            $('#btnSave').prop('disabled', true).addClass('is-loading').text(name + '加载失败');
        }

        function refreshSaveButton() {
            const ready = loaded.types && loaded.depts && loaded.detail && loaded.users;
            if (!ready) {
                return;
            }
            $('#btnSave').prop('disabled', false).removeClass('is-loading')
                .text(published ? '保存修改' : '保存草稿');
        }

        function buildDeptData(nodes) {
            return (nodes || []).map(function (node) {
                const disabled = Number(node.status) !== 1;
                return {
                    name: node.deptName + (disabled ? '（停用）' : ''),
                    value: String(node.deptId),
                    children: buildDeptData(node.children)
                };
            });
        }

        function collectExpandedKeys(nodes, keys) {
            (nodes || []).forEach(function (node) {
                if (node.children && node.children.length > 0) {
                    keys.push(node.value);
                    collectExpandedKeys(node.children, keys);
                }
            });
            return keys;
        }

        function renderDeptSelect() {
            if (deptSelect) {
                return;
            }
            deptSelect = xmSelect.render({
                el: '#deptSelect',
                data: deptData,
                filterable: true,
                tips: '请选择发布部门',
                tree: {
                    show: true,
                    strict: false,
                    expandedKeys: collectExpandedKeys(deptData, [])
                },
                theme: {color: PRIMARY}
            });
            window.noticeDeptSelect = deptSelect;
        }

        function renderUserSelect(preloadData) {
            if (userSelect) {
                return;
            }
            userSelect = xmSelect.render({
                el: '#userSelect',
                data: preloadData || [],
                filterable: true,
                remoteSearch: true,
                delay: 350,
                tips: '输入用户名或昵称搜索',
                theme: {color: PRIMARY},
                remoteMethod: function (query, callback) {
                    if (!query) {
                        callback((preloadData || []), (preloadData || []).length);
                        return;
                    }
                    $.ajax({
                        url: server_url + '/system/user/getUserOptions',
                        method: 'POST',
                        headers: {Authorization: token},
                        data: {keyword: $.trim(query)},
                        dataType: 'json',
                        success: function (resp) {
                            if (resp.code !== 0) {
                                callback([], 0);
                                return;
                            }
                            const data = (resp.data || []).map(function (user) {
                                return {
                                    name: (user.nickname || '') + '（' + (user.username || '') + '）',
                                    value: String(user.userId)
                                };
                            });
                            callback(data, data.length);
                        },
                        error: function () {
                            callback([], 0);
                        }
                    });
                }
            });
            window.noticeUserSelect = userSelect;
        }

        function preloadUsers(userIds, callback) {
            if (!userIds || userIds.length === 0) {
                renderUserSelect([]);
                loaded.users = true;
                refreshSaveButton();
                if (callback) callback();
                return;
            }
            const preloaded = [];
            let pending = userIds.length;
            userIds.forEach(function (userId) {
                $.ajax({
                    url: server_url + '/system/user/getUserDetail',
                    method: 'POST',
                    headers: {Authorization: token},
                    data: {userId: userId},
                    dataType: 'json',
                    success: function (resp) {
                        if (resp.code === 0 && resp.data) {
                            preloaded.push({
                                name: (resp.data.nickname || '') + '（' + (resp.data.username || '') + '）',
                                value: String(userId)
                            });
                        } else {
                            preloaded.push({name: '用户 ' + userId, value: String(userId)});
                        }
                    },
                    error: function () {
                        preloaded.push({name: '用户 ' + userId, value: String(userId)});
                    },
                    complete: function () {
                        pending--;
                        if (pending === 0) {
                            renderUserSelect(preloaded);
                            loaded.users = true;
                            refreshSaveButton();
                            if (callback) callback();
                        }
                    }
                });
            });
        }

        function loadTypes(callback) {
            $.ajax({
                url: server_url + '/system/noticeType/getNoticeTypeList',
                method: 'POST',
                headers: {Authorization: token},
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        loadFailed('公告类型');
                        return;
                    }
                    let options = '';
                    (resp.data || []).forEach(function (type) {
                        const disabled = Number(type.status) !== 1;
                        options += '<option value="' + type.noticeTypeId + '">'
                            + escapeOption(type.noticeTypeName) + (disabled ? '（停用）' : '') + '</option>';
                    });
                    if (!options) {
                        options = '<option value="">暂无公告类型</option>';
                    }
                    $('#noticeTypeId').html(options);
                    loaded.types = true;
                    if (detail && detail.noticeTypeId) {
                        $('select[name=noticeTypeId]').val(String(detail.noticeTypeId));
                    }
                    form.render('select');
                    if (published) {
                        $('select[name=publishScope]').prop('disabled', true);
                        form.render('select');
                    }
                    if (callback) callback();
                },
                error: function () {
                    loadFailed('公告类型');
                }
            });
        }

        function loadDepts(callback) {
            $.ajax({
                url: server_url + '/system/dept/getDeptTree',
                method: 'POST',
                contentType: 'application/json',
                headers: {Authorization: token},
                data: '{}',
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        loadFailed('部门');
                        return;
                    }
                    deptData = buildDeptData(resp.data || []);
                    loaded.depts = true;
                    renderDeptSelect();
                    if (detail && deptSelect) {
                        deptSelect.setValue((detail.deptIds || []).map(String));
                    }
                    if (callback) callback();
                },
                error: function () {
                    loadFailed('部门');
                }
            });
        }

        function escapeOption(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function loadDetail() {
            if (!noticeId) {
                loadFailed('公告');
                return;
            }
            $.ajax({
                url: BASE_URL + '/getNoticeDetail',
                method: 'POST',
                headers: {Authorization: token},
                data: {noticeId: noticeId},
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        loadFailed('公告');
                        return;
                    }
                    detail = resp.data || {};
                    published = Number(detail.status) === 1;
                    attachments = (detail.attachments || []).map(function (file) {
                        return {
                            fileId: String(file.fileId),
                            fileName: file.fileName,
                            fileExt: file.fileExt,
                            fileServerUrl: file.fileServerUrl
                        };
                    });
                    renderAttachments();
                    form.val('noticeForm', {
                        noticeId: String(detail.noticeId),
                        noticeTitle: detail.noticeTitle || '',
                        noticeLevel: String(detail.noticeLevel == null ? 0 : detail.noticeLevel),
                        noticeTypeId: String(detail.noticeTypeId || ''),
                        isTop: String(detail.isTop == null ? 0 : detail.isTop),
                        publishScope: String(detail.publishScope == null ? 1 : detail.publishScope)
                    });
                    form.render('select');
                    $('#noticeMeta').text('公告ID：' + detail.noticeId + ' · '
                        + (published ? '已发布' : '草稿'));
                    if (editor) {
                        editor.setHtml(detail.noticeContent || '<p><br></p>');
                    }
                    toggleScope(detail.publishScope);
                    if (loaded.types) {
                        $('select[name=noticeTypeId]').val(String(detail.noticeTypeId));
                        form.render('select');
                    }
                    if (deptSelect) {
                        deptSelect.setValue((detail.deptIds || []).map(String));
                    }
                    if (published) {
                        $('select[name=publishScope]').prop('disabled', true);
                        form.render('select');
                        $('#publishedScopeTip').addClass('is-show');
                        $('#deptSelect, #userSelect').css('pointer-events', 'none').css('opacity', .72);
                    }
                    preloadUsers((detail.userIds || []).map(String), function () {
                        userSelect.setValue((detail.userIds || []).map(String));
                    });
                    loaded.detail = true;
                    refreshSaveButton();
                },
                error: function () {
                    loadFailed('公告');
                }
            });
        }

        function toggleScope(scope) {
            $('#deptPanel').toggleClass('is-show', Number(scope) === 2);
            $('#userPanel').toggleClass('is-show', Number(scope) === 3);
        }

        function createRichEditor() {
            if (!window.wangEditor) {
                layer.msg('富文本编辑器加载失败');
                return;
            }
            const uploadConfig = function (fileTypes) {
                return {
                    server: server_url + '/system/file/uploadFile',
                    fieldName: 'file',
                    headers: {Authorization: token},
                    maxFileSize: 20 * 1024 * 1024,
                    allowedFileTypes: fileTypes,
                    customInsert: function (res, insertFn) {
                        if (!res || res.code !== 0) {
                            layer.msg((res && res.msg) || '文件上传失败');
                            return;
                        }
                        const fileUrl = window.yaya_resolve_file_url(res.data.fileServerUrl);
                        insertFn(fileUrl, res.data.fileName, fileUrl);
                    }
                };
            };
            editor = window.wangEditor.createEditor({
                selector: '#editorContent',
                html: '<p><br></p>',
                config: {
                    placeholder: '请输入公告内容...',
                    MENU_CONF: {
                        uploadImage: uploadConfig(['image/*']),
                        uploadVideo: uploadConfig(['video/*'])
                    }
                }
            });
            window.wangEditor.createToolbar({
                editor: editor,
                selector: '#editorToolbar',
                mode: 'default'
            });
            window.noticeEditor = editor;
        }

        function renderAttachments() {
            if (attachments.length === 0) {
                $('#attachmentList').empty();
                $('#attachmentEmpty').show();
                return;
            }
            $('#attachmentEmpty').hide();
            let html = '';
            attachments.forEach(function (file, index) {
                html += '<div class="attachment-item" data-index="' + index + '">'
                    + '<i class="layui-icon layui-icon-file" style="color:var(--yaya-primary);"></i>'
                    + '<span class="attachment-name" title="' + escapeOption(file.fileName) + '">'
                    + escapeOption(file.fileName) + '</span>'
                    + '<i class="layui-icon layui-icon-close-fill attachment-remove" '
                    + 'title="移除附件"></i></div>';
            });
            $('#attachmentList').html(html);
        }

        $('#btnUploadAttachment').on('click', function () {
            $('#attachmentFileInput').click();
        });

        $('#attachmentFileInput').on('change', function () {
            const files = Array.from(this.files || []);
            this.value = '';
            if (files.length === 0) {
                return;
            }
            if (attachments.length + files.length > MAX_ATTACHMENTS) {
                layer.msg('最多上传' + MAX_ATTACHMENTS + '个附件');
                return;
            }
            const loading = layer.load(0);
            let pending = files.length;
            files.forEach(function (file) {
                const formData = new FormData();
                formData.append('file', file);
                fetch(server_url + '/system/file/uploadFile', {
                    method: 'POST',
                    headers: {Authorization: token},
                    body: formData
                }).then(function (res) {
                    return res.json();
                }).then(function (resp) {
                    if (!resp || resp.code !== 0) {
                        layer.msg((resp && resp.msg) || '附件上传失败');
                        return;
                    }
                    if (attachments.length >= MAX_ATTACHMENTS) {
                        return;
                    }
                    const data = resp.data || {};
                    attachments.push({
                        fileId: String(data.fileId),
                        fileName: data.fileName,
                        fileExt: data.fileExt,
                        fileServerUrl: data.fileServerUrl
                    });
                }).catch(function () {
                    layer.msg('附件上传失败，请稍后重试');
                }).finally(function () {
                    pending--;
                    if (pending === 0) {
                        layer.close(loading);
                        renderAttachments();
                    }
                });
            });
        });

        $('#attachmentList').on('click', '.attachment-remove', function () {
            const item = $(this).closest('.attachment-item');
            const index = Number(item.data('index'));
            attachments.splice(index, 1);
            renderAttachments();
        });


        $('#btnCancel').on('click', closeSelf);
        form.on('select(publishScope)', function (data) {
            if (!published) {
                toggleScope(data.value);
            }
        });
        $('#publishScope').on('change', function () {
            if (!published) {
                toggleScope(this.value);
            }
        });

        form.on('submit(save)', function (data) {
            if (!loaded.detail || !loaded.types || !loaded.depts || !loaded.users) {
                layer.msg('公告数据尚未加载完成');
                return false;
            }
            if (!editor) {
                layer.msg('富文本编辑器未初始化');
                return false;
            }
            const field = data.field;
            const scope = published ? Number(detail.publishScope) : Number(field.publishScope);
            let deptIds = [];
            let userIds = [];
            if (published) {
                deptIds = (detail.deptIds || []).map(String);
                userIds = (detail.userIds || []).map(String);
            } else if (scope === 2) {
                deptIds = deptSelect ? (deptSelect.getValue('value') || []).map(String) : [];
                if (deptIds.length === 0) {
                    layer.msg('请选择发布部门');
                    return false;
                }
            } else if (scope === 3) {
                userIds = userSelect ? (userSelect.getValue('value') || []).map(String) : [];
                if (userIds.length === 0) {
                    layer.msg('请选择接收用户');
                    return false;
                }
            }
            if (!field.noticeTypeId) {
                layer.msg('请选择公告类型');
                return false;
            }
            const html = editor.getHtml();
            const text = editor.getText().trim();
            if (!text && html.indexOf('<img') === -1 && html.indexOf('<video') === -1) {
                layer.msg('请输入公告内容');
                return false;
            }
            const payload = {
                noticeId: String(detail.noticeId),
                noticeTitle: $.trim(field.noticeTitle),
                noticeContent: html,
                noticeLevel: Number(field.noticeLevel),
                noticeTypeId: String(field.noticeTypeId),
                isTop: Number(field.isTop),
                publishScope: scope,
                deptIds: deptIds,
                userIds: userIds,
                attachmentFileIds: attachments.map(function (item) { return item.fileId; })
            };
            const loading = layer.load(0);
            $.ajax({
                url: BASE_URL + '/updateNotice',
                method: 'POST',
                contentType: 'application/json',
                headers: {Authorization: token},
                data: JSON.stringify(payload),
                dataType: 'json',
                success: function (resp) {
                    layer.close(loading);
                    if (resp.code === 0) {
                        finish('公告保存成功');
                    } else {
                        layer.msg(resp.msg);
                    }
                },
                error: function () {
                    layer.close(loading);
                    layer.msg('请求失败，请稍后重试');
                }
            });
            return false;
        });

        createRichEditor();
        loadTypes(function () {
            loadDepts();
        });
        loadDetail();
        renderAttachments();
    });
</script>
</body>
</html>
