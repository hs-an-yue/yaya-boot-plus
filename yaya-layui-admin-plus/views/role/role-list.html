<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <title>角色管理</title>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="yaya-panel">
        <form class="layui-form" style="padding: 10px 0" onsubmit="return false;">
            <div class="layui-row">
                <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                    <label class="yaya-form-label">角色名称</label>
                    <div class="yaya-input-block">
                        <input type="text" id="roleName" placeholder="请输入角色名称" autocomplete="off" class="layui-input yaya-input-border-radius">
                    </div>
                </div>
                <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                    <label class="yaya-form-label">角色编号</label>
                    <div class="yaya-input-block">
                        <input type="text" id="roleCode" placeholder="请输入角色编号" autocomplete="off" class="layui-input yaya-input-border-radius">
                    </div>
                </div>
                <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                    <label class="yaya-form-label">状态</label>
                    <div class="yaya-input-block">
                        <select id="status">
                            <option value="">全部</option>
                            <option value="1">正常</option>
                            <option value="0">停用</option>
                        </select>
                    </div>
                </div>
                <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                    <button type="button" id="btnSearch" data-perm="role:search" class="yaya-btn yaya-primary">搜索</button>
                    <button type="button" id="btnReset" class="yaya-btn" style="margin-left: 10px;">重置</button>
                </div>
            </div>
        </form>
    </div>
    <div class="yaya-panel" style="margin-top: 10px;">
        <div style="display: flex;flex-direction: row;justify-content: flex-end;padding: 10px;">
            <button id="btnAdd" data-perm="role:add" type="button" class="yaya-btn yaya-primary">新增角色</button>
        </div>
        <table class="layui-hide" id="table-role" lay-filter="table-role"></table>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const table = layui.table;
        const layer = layui.layer;
        const form = layui.form;

        const TABLE_ID = 'table-role';
        const BASE_URL = server_url + '/system/role';

        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isRootRole(row) {
            return String(row.roleCode || '').toUpperCase() === 'ROOT';
        }

        function dataScopeText(scope) {
            const map = {
                1: '所有数据',
                2: '部门及子部门',
                3: '本部门',
                4: '本人',
                5: '自定义部门'
            };
            return map[Number(scope)] || '-';
        }

        function buildWhere() {
            const where = {};
            const roleName = $.trim($('#roleName').val());
            const roleCode = $.trim($('#roleCode').val());
            const status = $('#status').val();
            if (roleName) {
                where.roleName = roleName;
            }
            if (roleCode) {
                where.roleCode = roleCode;
            }
            if (status !== '') {
                where.status = Number(status);
            }
            return where;
        }

        function reloadTable() {
            table.reload(TABLE_ID, {
                where: buildWhere(),
                page: {
                    curr: 1,
                    prev: '上一页',
                    next: '下一页',
                    theme: '#409eff'
                }
            });
        }

        table.render({
            elem: '#table-role',
            id: TABLE_ID,
            url: BASE_URL + '/getRolePage',
            method: 'post',
            headers: {
                Authorization: token
            },
            contentType: 'application/json',
            request: {
                pageName: 'pageNum',
                limitName: 'pageSize'
            },
            where: buildWhere(),
            parseData: function (res) {
                return {
                    code: res.code,
                    msg: res.msg,
                    count: (res.data && res.data.total) || 0,
                    data: (res.data && res.data.records) || []
                };
            },
            skin: 'line',
            page: {
                prev: '上一页',
                next: '下一页',
                theme: '#409eff'
            },
            limit: 10,
            limits: [10, 20, 50],
            defaultToolbar: [],
            cols: [[
                {field: 'roleName', title: '角色名称', minWidth: 130},
                {field: 'roleCode', title: '角色编号', width: 130},
                {
                    field: 'deptName',
                    title: '所属部门',
                    width: 110,
                    templet: function (row) {
                        return escapeHtml(row.deptName) || '-';
                    }
                },
                {
                    title: '数据权限',
                    width: 110,
                    templet: function (row) {
                        return dataScopeText(row.dataScope);
                    }
                },
                {
                    title: '状态',
                    width: 70,
                    align: 'center',
                    templet: function (row) {
                        if (Number(row.status) === 1) {
                            return '<span class="yaya-tag yaya-tag-plain-success is-round tag-small">正常</span>';
                        }
                        return '<span class="yaya-tag yaya-tag-plain-danger is-round tag-small">停用</span>';
                    }
                },
                {
                    field: 'remark',
                    title: '备注',
                    minWidth: 120,
                    templet: function (row) {
                        return escapeHtml(row.remark) || '-';
                    }
                },
                {
                    field: 'createByName',
                    title: '创建人',
                    width: 100,
                    templet: function (row) {
                        return escapeHtml(row.createByName) || '-';
                    }
                },
                {field: 'createTime', title: '创建时间', width: 165},
                {
                    title: '操作',
                    fixed: 'right',
                    width: 290,
                    templet: function (row) {
                        if (isRootRole(row)) {
                            return '<button class="yaya-btn yaya-btn-small" type="button" disabled style="opacity:.45;cursor:not-allowed;">菜单授权</button>'
                                + '<button class="yaya-btn yaya-btn-small" type="button" disabled style="opacity:.45;cursor:not-allowed;margin-left:6px;">编辑</button>'
                                + '<button class="yaya-btn yaya-btn-small" type="button" disabled style="opacity:.45;cursor:not-allowed;margin-left:6px;">删除</button>';
                        }
                        const enabled = Number(row.status) === 1;
                        return window.yaya_permission_actions([
                            {text: '菜单授权', event: 'menu', perm: 'role:menu'},
                            {text: '编辑', event: 'edit', perm: 'role:update'},
                            {
                                text: enabled ? '停用' : '启用',
                                event: 'status',
                                perm: enabled ? 'role:disable' : 'role:enable',
                                className: 'yaya-btn is-link-success yaya-btn-small'
                            },
                            {
                                text: '删除', event: 'delete', perm: 'role:del',
                                className: 'yaya-btn is-link-danger yaya-btn-small'
                            }
                        ]);
                    }
                }
            ]]
        });

        function openAddRole() {
            layer.open({
                type: 2,
                title: '新增角色',
                area: ['680px', '80%'],
                shadeClose: true,
                content: 'role-add.html',
                end: function () {
                    reloadTable();
                }
            });
        }

        function openEditRole(roleId) {
            layer.open({
                type: 2,
                title: '编辑角色',
                area: ['680px', '80%'],
                shadeClose: true,
                content: 'role-edit.html?roleId=' + encodeURIComponent(roleId),
                end: function () {
                    reloadTable();
                }
            });
        }

        function openMenuAuth(row) {
            layer.open({
                type: 2,
                title: '菜单授权 - ' + escapeHtml(row.roleName),
                area: ['760px', '80%'],
                shadeClose: true,
                content: 'role-menu.html?roleId=' + encodeURIComponent(row.roleId),
                end: function () {
                    reloadTable();
                }
            });
        }

        function toggleStatus(row) {
            const targetStatus = Number(row.status) === 1 ? 0 : 1;
            const actionText = targetStatus === 1 ? '启用' : '停用';
            layer.confirm('确定' + actionText + '角色「' + escapeHtml(row.roleName) + '」吗？', {
                title: '提示'
            }, function (index) {
                layer.close(index);
                $.ajax({
                    url: BASE_URL + '/updateRoleStatus',
                    method: 'POST',
                    headers: {
                        Authorization: token
                    },
                    data: {
                        roleId: row.roleId,
                        status: targetStatus
                    },
                    dataType: 'json',
                    success: function (resp) {
                        layer.msg(resp.msg);
                        if (resp.code === 0) {
                            reloadTable();
                        }
                    },
                    error: function () {
                        layer.msg('请求失败，请稍后重试');
                    }
                });
            });
        }

        function deleteRole(row) {
            layer.confirm('确定删除角色「' + escapeHtml(row.roleName) + '」吗？', {
                title: '提示'
            }, function (index) {
                layer.close(index);
                $.ajax({
                    url: BASE_URL + '/deleteRole',
                    method: 'POST',
                    headers: {
                        Authorization: token
                    },
                    data: {
                        roleId: row.roleId
                    },
                    dataType: 'json',
                    success: function (resp) {
                        layer.msg(resp.msg);
                        if (resp.code === 0) {
                            reloadTable();
                        }
                    },
                    error: function () {
                        layer.msg('请求失败，请稍后重试');
                    }
                });
            });
        }

        $('#btnSearch').on('click', reloadTable);
        $('#btnReset').on('click', function () {
            $('#roleName').val('');
            $('#roleCode').val('');
            $('#status').val('');
            form.render('select');
            reloadTable();
        });
        $('#btnAdd').on('click', openAddRole);

        table.on('tool(' + TABLE_ID + ')', function (obj) {
            if (obj.event === 'menu') {
                openMenuAuth(obj.data);
            } else if (obj.event === 'edit') {
                openEditRole(obj.data.roleId);
            } else if (obj.event === 'status') {
                toggleStatus(obj.data);
            } else if (obj.event === 'delete') {
                deleteRole(obj.data);
            }
        });
    });
</script>
</body>
</html>
