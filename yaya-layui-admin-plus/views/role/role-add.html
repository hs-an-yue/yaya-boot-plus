<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <link rel="stylesheet" href="../../font/bootstrap-icons.css">
    <title>角色新增</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            overflow-y: auto;
        }
        .yaya-box-fluid {
            padding-bottom: 24px;
        }
        .layui-form-label {
            width: 100px;
        }
        .layui-input-block {
            margin-left: 130px;
        }
        .yaya-form-hint {
            margin-top: 4px;
            font-size: 12px;
            color: var(--yaya-text-4);
            line-height: 20px;
        }
        #deptTree .xm-select {
            width: 100%;
        }
    </style>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="layui-fluid">
        <form class="layui-form" lay-filter="roleForm" style="margin-top: 10px;">
            <div class="layui-form-item">
                <label class="layui-form-label">角色名称</label>
                <div class="layui-input-block">
                    <input type="text" name="roleName" lay-verify="required" maxlength="200"
                           placeholder="请输入角色名称" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">角色编号</label>
                <div class="layui-input-block">
                    <input type="text" name="roleCode" lay-verify="required" maxlength="200"
                           placeholder="例如 OPERATION" autocomplete="off" class="layui-input">
                    <div class="yaya-form-hint">角色编号全局唯一，创建后不可修改；仅支持字母、数字、下划线和连字符，保存时自动转为大写</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">数据权限</label>
                <div class="layui-input-block">
                    <select name="dataScope" lay-filter="dataScope">
                        <option value="1">所有数据</option>
                        <option value="2">部门及子部门数据</option>
                        <option value="3">本部门数据</option>
                        <option value="4">本人数据</option>
                        <option value="5">自定义部门数据</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item" id="deptItem" style="display: none;">
                <label class="layui-form-label">自定义部门</label>
                <div class="layui-input-block">
                    <div id="deptTree"></div>
                    <div class="yaya-form-hint">仅所选部门生效，不自动包含子部门</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="正常" checked>
                    <input type="radio" name="status" value="0" title="停用">
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" maxlength="500" placeholder="请输入备注" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" id="btnSave" data-perm="role:add" class="yaya-btn yaya-primary" lay-submit lay-filter="save">保存</button>
                    <button type="button" class="yaya-btn" id="btnCancel" style="margin-left: 10px;">取消</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script src="../../js/xm-select.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const layer = layui.layer;
        const form = layui.form;

        let deptData = [];
        let deptSelect = null;
        let treeLoaded = false;
        let treeLoading = false;

        function buildDeptData(nodes) {
            return (nodes || []).map(function (node) {
                return {
                    name: node.deptName,
                    value: String(node.deptId),
                    children: buildDeptData(node.children)
                };
            });
        }

        function collectExpandedKeys(nodes, keys) {
            (nodes || []).forEach(function (node) {
                if (node.children && node.children.length > 0) {
                    keys.push(node.value);
                    collectExpandedKeys(node.children, keys);
                }
            });
            return keys;
        }

        function loadDeptTree() {
            if (treeLoading) {
                return;
            }
            treeLoading = true;
            const loading = layer.load(0);
            $.ajax({
                url: server_url + '/system/dept/getDeptTree',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: '{}',
                dataType: 'json',
                success: function (resp) {
                    layer.close(loading);
                    if (resp.code !== 0) {
                        treeLoading = false;
                        layer.msg(resp.msg);
                        return;
                    }
                    deptData = buildDeptData(resp.data || []);
                    treeLoaded = true;
                    treeLoading = false;
                    if (Number($('select[name=dataScope]').val()) === 5) {
                        ensureDeptSelect();
                    }
                },
                error: function () {
                    treeLoading = false;
                    layer.close(loading);
                    layer.msg('部门数据加载失败，请稍后重试');
                }
            });
        }

        function ensureDeptSelect() {
            if (!treeLoaded) {
                loadDeptTree();
                return;
            }
            if (deptSelect) {
                return;
            }
            deptSelect = xmSelect.render({
                el: '#deptTree',
                data: deptData,
                tree: {
                    show: true,
                    strict: false,
                    expandedKeys: collectExpandedKeys(deptData, [])
                },
                filterable: true,
                tips: '请选择自定义部门',
                theme: {
                    color: '#409eff'
                }
            });
            window.roleDeptSelect = deptSelect;
        }

        function toggleDept(scope) {
            const show = Number(scope) === 5;
            $('#deptItem').toggle(show);
            if (show) {
                ensureDeptSelect();
            }
        }

        form.on('select(dataScope)', function (data) {
            toggleDept(data.value);
        });

        $('select[name=dataScope]').on('change', function () {
            toggleDept(this.value);
        });

        function closeSelf() {
            if (parent && parent.layer && parent.layer.getFrameIndex) {
                const index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                return;
            }
            layer.closeAll();
        }

        function finish(message) {
            if (parent && parent.layer && parent.layer.msg) {
                parent.layer.msg(message);
            } else {
                layer.msg(message);
            }
            closeSelf();
        }

        function findRoleIdByCode(roleCode, callback) {
            $.ajax({
                url: server_url + '/system/role/getRolePage',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: JSON.stringify({
                    pageNum: 1,
                    pageSize: 10,
                    roleCode: roleCode
                }),
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        callback(null);
                        return;
                    }
                    const record = (resp.data.records || []).find(function (item) {
                        return item.roleCode === roleCode;
                    });
                    callback(record ? String(record.roleId) : null);
                },
                error: function () {
                    callback(null);
                }
            });
        }

        function saveRoleDept(roleId, deptIds, callback) {
            $.ajax({
                url: server_url + '/system/role/saveRoleDept',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: JSON.stringify({
                    roleId: roleId,
                    deptIds: deptIds
                }),
                dataType: 'json',
                success: function (resp) {
                    callback(resp.code === 0, resp.msg);
                },
                error: function () {
                    callback(false, '请求失败，请稍后重试');
                }
            });
        }

        $('#btnCancel').on('click', closeSelf);

        form.on('submit(save)', function (data) {
            const field = data.field;
            const dataScope = Number(field.dataScope);
            const deptIds = (dataScope === 5 && deptSelect)
                ? (deptSelect.getValue('value') || []).map(String)
                : [];
            if (dataScope === 5 && deptIds.length === 0) {
                layer.msg('请选择自定义部门');
                return false;
            }
            // 角色编号统一大写提交, 与后端入库规范化一致, 保证自定义部门流程按编号回查角色ID能命中
            const roleCode = $.trim(field.roleCode).toUpperCase();
            const loading = layer.load(0);
            $.ajax({
                url: server_url + '/system/role/addRole',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: JSON.stringify({
                    roleName: $.trim(field.roleName),
                    roleCode: roleCode,
                    dataScope: dataScope,
                    status: Number(field.status),
                    remark: $.trim(field.remark || '') || null
                }),
                dataType: 'json',
                success: function (resp) {
                    layer.close(loading);
                    if (resp.code !== 0) {
                        layer.msg(resp.msg);
                        return;
                    }
                    if (dataScope !== 5) {
                        finish('新增成功');
                        return;
                    }
                    // 自定义部门需要角色ID: 新增成功后按编号查询, 再保存部门
                    findRoleIdByCode(roleCode, function (roleId) {
                        if (!roleId) {
                            finish('角色已创建，但未找到角色ID，请到编辑页配置自定义部门');
                            return;
                        }
                        saveRoleDept(roleId, deptIds, function (ok, msg) {
                            if (ok) {
                                finish('新增成功');
                            } else {
                                finish('角色已创建，自定义部门保存失败：' + msg + '，请编辑角色重新配置');
                            }
                        });
                    });
                },
                error: function () {
                    layer.close(loading);
                    layer.msg('请求失败，请稍后重试');
                }
            });
            return false;
        });

        loadDeptTree();
    });
</script>
</body>
</html>
