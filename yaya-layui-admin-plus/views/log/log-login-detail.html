<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <title>登录日志详情</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            overflow-y: auto;
            background: var(--yaya-card);
        }
        .yaya-box-fluid {
            width: 100%;
            margin: 0;
            padding: 12px 0 0;
        }
        .yaya-panel {
            padding: 0;
            overflow: hidden;
        }
        .yaya-log-detail {
            max-height: none;
        }
        .yaya-detail-state {
            padding: 70px 24px;
            text-align: center;
            color: var(--yaya-text-3);
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="yaya-panel">
        <div id="detailRoot">
            <div class="yaya-detail-state">登录日志详情加载中...</div>
        </div>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const layer = layui.layer;

        const logId = new URLSearchParams(location.search).get('logId');
        const detailRoot = document.getElementById('detailRoot');

        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function copyText(text) {
            if (!text) {
                layer.msg('没有可复制的内容');
                return;
            }
            const done = function () {
                layer.msg('已复制');
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done, function () {
                    layer.msg('复制失败，请手动复制');
                });
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    done();
                } catch (e) {
                    layer.msg('复制失败，请手动复制');
                }
                document.body.removeChild(ta);
            }
        }

        function detailField(label, value, mono, full) {
            return '<div class="yaya-log-field' + (full ? ' is-full' : '') + '">'
                + '<span class="yaya-log-label">' + label + '</span>'
                + '<span class="yaya-log-value' + (mono ? ' is-mono' : '') + '">'
                + (value == null || value === '' ? '-' : escapeHtml(value)) + '</span>'
                + '</div>';
        }

        function showState(message) {
            detailRoot.innerHTML = '<div class="yaya-detail-state">' + escapeHtml(message) + '</div>';
        }

        function render(row) {
            const success = Number(row.status) === 1;
            const duration = row.executionTime == null ? '-' : row.executionTime + ' ms';
            const fields = [
                detailField('日志ID', row.logId, true),
                detailField('账号', row.username),
                detailField('操作人', row.operName),
                detailField('IP', row.ip),
                detailField('登录地点', row.address),
                detailField('浏览器', row.browser),
                detailField('登录时间', row.operTime),
                detailField('耗时', duration),
                detailField('链路ID', row.trackId, true)
            ].join('');
            const copyButton = row.requestParams
                ? '<button type="button" class="yaya-log-copy" data-target="#yayaLoginLogParams">复制</button>'
                : '';
            const errorSection = row.errorMsg ? `
                <div class="yaya-log-section is-error">
                    <div class="yaya-log-section-head">
                        <span class="yaya-log-section-title">错误信息</span>
                    </div>
                    <pre class="yaya-log-code">${escapeHtml(row.errorMsg)}</pre>
                </div>` : '';
            detailRoot.innerHTML = `
                <div class="yaya-log-detail">
                    <div class="yaya-log-hero">
                        <div class="yaya-log-hero-main">
                            <span class="yaya-log-hero-icon${success ? '' : ' is-fail'}">
                                <i class="layui-icon ${success ? 'layui-icon-ok' : 'layui-icon-close'}"></i>
                            </span>
                            <div style="min-width: 0;">
                                <div class="yaya-log-hero-title">${escapeHtml(row.businessName) || '登录日志'}</div>
                                <div class="yaya-log-hero-sub">账号 ${escapeHtml(row.username || '-')} · ${escapeHtml(row.operTime)} · 耗时 ${escapeHtml(duration)}</div>
                            </div>
                        </div>
                        <span class="yaya-log-status ${success ? 'is-success' : 'is-fail'}">
                            <span class="yaya-log-dot"></span>${success ? '成功' : '失败'}
                        </span>
                    </div>
                    <div class="yaya-log-grid">${fields}</div>
                    <div class="yaya-log-section">
                        <div class="yaya-log-section-head">
                            <span class="yaya-log-section-title">请求参数</span>
                            ${copyButton}
                        </div>
                        <pre class="yaya-log-code" id="yayaLoginLogParams">${row.requestParams ? escapeHtml(row.requestParams) : '无'}</pre>
                    </div>
                    ${errorSection}
                </div>`;
        }

    
        $(document).on('click', '.yaya-log-copy', function () {
            copyText($($(this).data('target')).text());
        });

        if (!logId) {
            showState('缺少日志ID');
            return;
        }
        const loading = layer.load(0);
        $.ajax({
            url: server_url + '/system/sysLog/getSysLogDetail',
            method: 'POST',
            headers: {
                Authorization: token
            },
            data: {
                logId: logId
            },
            dataType: 'json',
            success: function (resp) {
                layer.close(loading);
                if (resp.code !== 0) {
                    showState(resp.msg);
                    return;
                }
                render(resp.data);
            },
            error: function () {
                layer.close(loading);
                showState('登录日志详情加载失败，请稍后重试');
            }
        });
    });
</script>
</body>
</html>
