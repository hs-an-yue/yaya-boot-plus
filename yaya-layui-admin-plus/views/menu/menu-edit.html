<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <link rel="stylesheet" href="../../font/bootstrap-icons.css">
    <title>菜单编辑</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            overflow-y: auto;
        }
        .yaya-box-fluid {
            padding-bottom: 24px;
        }
        .layui-form-label {
            width: 100px;
        }
        .layui-input-block {
            margin-left: 130px;
        }
        .layui-input:focus {
            border-color: var(--yaya-primary) !important;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, .12);
        }
        /* 父菜单 xm-select 宽度与圆角 */
        #parentId {
            width: 100%;
        }
        #parentId xm-select {
            width: 100%;
            box-sizing: border-box;
            border-radius: var(--yaya-radius-md);
        }
    </style>
</head>
<body>
    <div class="yaya-box-fluid">
        <div class="layui-fluid">
            <form class="layui-form" lay-filter="menuForm" style="margin-top: 10px;">
                <input type="hidden" name="menuId">
                <div class="layui-form-item">
                    <label class="layui-form-label">父菜单</label>
                    <div class="layui-input-block">
                        <div id="parentId"></div>
                        <input type="hidden" name="parentId" id="parentIdValue" value="0">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">菜单类型</label>
                    <div class="layui-input-block">
                        <select name="menuType" id="menuType" lay-filter="menuType" disabled>
                            <option value="1">目录</option>
                            <option value="2" selected>菜单</option>
                            <option value="3">按钮</option>
                        </select>
                        <div class="layui-form-mid layui-word-aux">菜单类型创建后不可修改</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">菜单名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="menuTitle" lay-verify="required" maxlength="100"
                               placeholder="请输入菜单名称" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">菜单图标</label>
                    <div class="layui-input-block">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="text" name="menuIcon" id="menuIcon" maxlength="200"
                                   placeholder="例如 bi bi-gear-fill 或 layui-icon layui-icon-home" autocomplete="off" class="layui-input" style="flex: 1;">
                            <button type="button" id="btnIconPicker" class="yaya-btn is-plain-primary" style="white-space: nowrap; height: 38px;">选择图标</button>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <i id="iconPreview"></i>
                            <span id="iconPreviewText">图标预览</span>
                        </div>
                        <div class="layui-word-aux">
                            支持 bootstrap-icons（bi bi-xxx）和 layui 图标（layui-icon layui-icon-xxx）
                        </div>
                    </div>
                </div>
                <div class="layui-form-item field-menuUrl">
                    <label class="layui-form-label">菜单地址</label>
                    <div class="layui-input-block">
                        <input type="text" name="menuUrl" maxlength="200"
                               placeholder="例如 views/menu/menu-list.html" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item field-perms">
                    <label class="layui-form-label">权限标识</label>
                    <div class="layui-input-block">
                        <input type="text" name="perms" maxlength="100"
                               placeholder="例如 system:menu:list" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort" value="1" min="0" placeholder="请输入排序序号"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="正常" checked>
                        <input type="radio" name="status" value="0" title="停用">
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea name="remark" maxlength="500" placeholder="请输入备注"
                                  class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button type="button" id="btnSave" data-perm="menu:update" class="yaya-btn yaya-primary" lay-submit lay-filter="save">保存</button>
                        <button type="button" class="yaya-btn" id="btnCancel" style="margin-left: 10px;">取消</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="../../layui/layui.js"></script>
    <script src="../../js/server.js"></script>
    <script src="../../js/xm-select.js"></script>
    <script src="../../js/menu-icon-picker.js"></script>
    <script>
        layui.use(function () {
            const $ = layui.$;
            const layer = layui.layer;
            const form = layui.form;

            // 编辑页必须携带 menuId
            const menuId = new URLSearchParams(location.search).get('menuId');

            let menuTree = [];
            let menuDetail = null;
            let treeLoaded = false;
            let detailLoaded = false;
            let parentSelect = null;
            let currentExcluded = new Set();

            /**
             * 按菜单类型显示/隐藏对应字段
             * 目录: 容器; 菜单: 需要跳转地址; 按钮: 需要权限标识
             */
            function toggleTypeFields(menuType) {
                const type = Number(menuType);
                $('.field-menuUrl').toggle(type === 2);
                $('.field-perms').toggle(type === 3);
            }

            // 防止树或详情加载失败时误提交
            function disableSave() {
                $('#btnSave').prop('disabled', true).css('opacity', .5);
            }

            if (!menuId) {
                disableSave();
                layer.msg('缺少菜单ID');
            }

            /**
             * 刷新图标预览
             */
            function updateIconPreview() {
                const icon = $.trim($('#menuIcon').val());
                $('#iconPreview').attr('class', icon);
                $('#iconPreviewText').text(icon ? '' : '图标预览');
            }

            $('#menuIcon').on('input', updateIconPreview);
            yayaIconPicker.render(layui.dropdown, '#menuIcon', '#btnIconPicker');

            /**
             * 在菜单树中查找节点
             */
            function findNode(nodes, id) {
                for (const node of nodes || []) {
                    if (String(node.menuId) === String(id)) {
                        return node;
                    }
                    const found = findNode(node.children, id);
                    if (found) {
                        return found;
                    }
                }
                return null;
            }

            /**
             * 收集节点及其所有子孙节点(编辑时不能把自己挂在自身上)
             */
            function collectExcluded(nodes, excluded) {
                (nodes || []).forEach(function (node) {
                    excluded.add(String(node.menuId));
                    collectExcluded(node.children, excluded);
                });
            }

            /**
             * 转换为 xm-select 树形数据
             * 按钮、当前节点子树不参与; onlyMenus=true 时只保留菜单类型
             */
            function buildParentData(nodes, excluded, onlyMenus) {
                const result = [];
                (nodes || []).forEach(function (node) {
                    const menuType = Number(node.menuType);
                    const nodeId = String(node.menuId);
                    // 当前节点子树不能作为父级
                    if (excluded.has(nodeId)) {
                        return;
                    }
                    // 按钮不能作为父级, 整棵子树忽略
                    if (menuType === 3) {
                        return;
                    }
                    const children = buildParentData(node.children, excluded, onlyMenus);
                    if (!onlyMenus || menuType === 2) {
                        result.push({
                            name: node.menuTitle,
                            value: nodeId,
                            children: children
                        });
                    } else {
                        // 只保留菜单时, 目录本身不展示, 但目录下的菜单继续上移
                        result.push.apply(result, children);
                    }
                });
                return result;
            }

            /**
             * 收集需要展开的节点
             */
            function collectExpandedKeys(nodes, keys) {
                (nodes || []).forEach(function (node) {
                    if (node.children && node.children.length > 0) {
                        keys.push(node.value);
                        collectExpandedKeys(node.children, keys);
                    }
                });
                return keys;
            }

            /**
             * 收集下拉中可选的父菜单值
             */
            function collectParentValues(nodes, values) {
                (nodes || []).forEach(function (node) {
                    values.add(String(node.value));
                    collectParentValues(node.children, values);
                });
                return values;
            }

            /**
             * 根据菜单类型刷新父菜单可选项
             * 按钮的父级只能是菜单, 且不能为顶级
             */
            function applyParentSelect(menuType, preferredValue) {
                const isButton = Number(menuType) === 3;
                const data = isButton
                    ? buildParentData(menuTree, currentExcluded, true)
                    : [{name: '顶级菜单', value: '0'}].concat(buildParentData(menuTree, currentExcluded, false));
                const expandedKeys = collectExpandedKeys(isButton ? data : data.slice(1), []);
                const options = {
                    data: data,
                    tree: {
                        show: true,
                        strict: false,
                        expandedKeys: expandedKeys
                    },
                    tips: isButton ? '请选择菜单作为父级' : '请选择父菜单'
                };

                if (!parentSelect) {
                    parentSelect = xmSelect.render(Object.assign({
                        el: '#parentId',
                        radio: true,
                        clickClose: true,
                        filterable: true,
                        theme: {color: '#409eff'},
                        on: function (data) {
                            const first = data.arr && data.arr[0];
                            $('#parentIdValue').val(first ? String(first.value) : '');
                        }
                    }, options));
                } else {
                    parentSelect.update(options);
                }

                const values = collectParentValues(data, new Set());
                let value = preferredValue !== undefined ? String(preferredValue) : $('#parentIdValue').val();
                if (!value || !values.has(String(value))) {
                    value = isButton ? '' : '0';
                }
                if (value) {
                    parentSelect.setValue([value]);
                } else {
                    parentSelect.setValue([]);
                }
                $('#parentIdValue').val(value);
            }

            /**
             * 树和详情都加载完成后初始化表单
             */
            function initFormIfReady() {
                if (!treeLoaded || !detailLoaded) {
                    return;
                }

                currentExcluded = new Set();
                const current = findNode(menuTree, menuId);
                if (current) {
                    collectExcluded([current], currentExcluded);
                }

                const selectedParentId = String(menuDetail.parentId == null ? 0 : menuDetail.parentId);
                const menuType = String(menuDetail.menuType == null ? 2 : menuDetail.menuType);

                form.val('menuForm', {
                    menuId: String(menuDetail.menuId),
                    parentId: selectedParentId,
                    menuType: menuType,
                    menuTitle: menuDetail.menuTitle || '',
                    menuIcon: menuDetail.menuIcon || '',
                    menuUrl: menuDetail.menuUrl || '',
                    perms: menuDetail.perms || '',
                    sort: menuDetail.sort == null ? 1 : menuDetail.sort,
                    status: String(menuDetail.status == null ? 1 : menuDetail.status),
                    remark: menuDetail.remark || ''
                });
                toggleTypeFields(menuType);
                applyParentSelect(menuType, selectedParentId);

                form.render();
                updateIconPreview();
            }

            // 加载完整菜单树, 用于父菜单下拉
            $.ajax({
                url: server_url + '/system/menu/getMenuTree',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: JSON.stringify({}),
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        disableSave();
                        layer.msg(resp.msg);
                        return;
                    }
                    menuTree = resp.data || [];
                    treeLoaded = true;
                    initFormIfReady();
                },
                error: function () {
                    disableSave();
                    layer.msg('菜单数据加载失败，请稍后重试');
                }
            });

            // 加载菜单详情
            if (menuId) {
                $.ajax({
                    url: server_url + '/system/menu/getMenuDetail',
                    method: 'POST',
                    headers: {
                        Authorization: token
                    },
                    data: {
                        menuId: menuId
                    },
                    dataType: 'json',
                    success: function (resp) {
                        if (resp.code !== 0) {
                            disableSave();
                            layer.msg(resp.msg);
                            return;
                        }
                        menuDetail = resp.data;
                        detailLoaded = true;
                        initFormIfReady();
                    },
                    error: function () {
                        disableSave();
                        layer.msg('菜单详情加载失败，请稍后重试');
                    }
                });
            }

            /**
             * 关闭当前 iframe 弹层
             */
            function closeSelf() {
                if (parent && parent.layer && parent.layer.getFrameIndex) {
                    const index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    return;
                }
                layer.closeAll();
            }

            // 取消
            $('#btnCancel').on('click', function () {
                closeSelf();
            });

            // 保存
            form.on('submit(save)', function (data) {
                if (!menuId) {
                    layer.msg('缺少菜单ID');
                    return false;
                }
                const field = data.field;
                // 类型下拉已禁用, 从元素读取保证值不丢失
                const menuType = Number($('#menuType').val());
                const parentId = field.parentId ? String(field.parentId) : '';
                if (menuType === 3) {
                    if (!parentId || parentId === '0') {
                        layer.msg('按钮类型不能是顶层菜单，请选择菜单作为父级');
                        return false;
                    }
                    const parent = findNode(menuTree, parentId);
                    if (!parent || Number(parent.menuType) !== 2) {
                        layer.msg('按钮类型的父级只能是菜单，目录不能创建按钮');
                        return false;
                    }
                }
                const payload = {
                    menuId: menuId,
                    menuTitle: $.trim(field.menuTitle),
                    menuType: menuType,
                    menuIcon: $.trim(field.menuIcon || ''),
                    menuUrl: $.trim(field.menuUrl || ''),
                    perms: $.trim(field.perms || ''),
                    parentId: parentId || '0',
                    sort: field.sort === '' ? 1 : Number(field.sort),
                    status: Number(field.status),
                    remark: $.trim(field.remark || '')
                };
                // 按类型清理不适用字段, 避免类型切换后残留旧数据
                if (payload.menuType === 1) {
                    payload.menuUrl = '';
                    payload.perms = '';
                } else if (payload.menuType === 2) {
                    payload.perms = '';
                } else {
                    payload.menuUrl = '';
                }

                const index = layer.load(0);
                $.ajax({
                    url: server_url + '/system/menu/updateMenu',
                    method: 'POST',
                    contentType: 'application/json',
                    headers: {
                        Authorization: token
                    },
                    data: JSON.stringify(payload),
                    dataType: 'json',
                    success: function (resp) {
                        layer.close(index);
                        if (resp.code === 0) {
                            if (parent && parent.layer && parent.layer.msg) {
                                parent.layer.msg('更新成功');
                            } else {
                                layer.msg('更新成功');
                            }
                            closeSelf();
                        } else {
                            layer.msg(resp.msg);
                        }
                    },
                    error: function () {
                        layer.close(index);
                        layer.msg('请求失败，请稍后重试');
                    }
                });
                return false;
            });
        });
    </script>
</body>
</html>
