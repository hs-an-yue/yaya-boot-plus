<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 响应式配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- LayUI css库 -->
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <link rel="stylesheet" href="../../font/bootstrap-icons.css">
    <title>菜单管理</title>
</head>
<body>
    <div class="yaya-box-fluid">
        <div class="yaya-panel">
            <!-- 搜索条件 -->
            <form class="layui-form" style="padding: 10px 0" onsubmit="return false;">
                <div class="layui-row">
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <label class="yaya-form-label">菜单名称</label>
                        <div class="yaya-input-block">
                            <input type="text" id="menuTitle" placeholder="请输入菜单名称" autocomplete="off" class="layui-input yaya-input-border-radius">
                        </div>
                    </div>
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <label class="yaya-form-label">菜单类型</label>
                        <div class="yaya-input-block">
                            <select id="menuType">
                                <option value="">全部</option>
                                <option value="1">目录</option>
                                <option value="2">菜单</option>
                                <option value="3">按钮</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <label class="yaya-form-label">状态</label>
                        <div class="yaya-input-block">
                            <select id="status">
                                <option value="">全部</option>
                                <option value="1">正常</option>
                                <option value="0">停用</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-col-md3 layui-col-sm3 yaya-form-item">
                        <button type="button" id="btnSearch" data-perm="menu:search" class="yaya-btn yaya-primary">搜索</button>
                        <button type="button" id="btnReset" class="yaya-btn" style="margin-left: 10px;">重置</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="yaya-panel" style="margin-top: 10px;">
            <!-- 菜单操作按钮 -->
            <div style="display: flex;flex-direction: row;justify-content: flex-end;padding: 10px;">
                <button id="btnExpandAll" type="button" class="yaya-btn yaya-default" style="margin-right: 10px;">展开</button>
                <button id="btnCollapseAll" type="button" class="yaya-btn yaya-default" style="margin-right: 10px;">收起</button>
                <button id="btnAdd" data-perm="menu:add" type="button" class="yaya-btn yaya-primary">新增菜单</button>
            </div>
            <!-- 表格数据显示 -->
            <table class="layui-hide" id="treeTable" lay-filter="menuTable"></table>
        </div>
    </div>
    <script src="../../layui/layui.js"></script>
    <script src="../../js/server.js"></script>
    <script>
        layui.use(function () {
            const $ = layui.$;
            const layer = layui.layer;
            const form = layui.form;
            const treeTable = layui.treeTable;

            const TABLE_ID = 'menuTable';

            function escapeHtml(text) {
                return String(text == null ? '' : text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function safeMenuIcon(value) {
                const icon = String(value == null ? '' : value).trim();
                return /^[A-Za-z0-9 _-]+$/.test(icon) ? icon : '';
            }

            /**
             * 组装查询条件, 全部条件的值不传
             */
            function buildWhere() {
                const where = {};
                const menuTitle = $.trim($('#menuTitle').val());
                if (menuTitle) {
                    where.menuTitle = menuTitle;
                }
                const menuType = $('#menuType').val();
                if (menuType !== '') {
                    where.menuType = Number(menuType);
                }
                const status = $('#status').val();
                if (status !== '') {
                    where.status = Number(status);
                }
                return where;
            }

            /**
             * 重新加载菜单树
             */
            function reloadTable() {
                treeTable.reload(TABLE_ID, {
                    where: buildWhere()
                });
            }

            // 表格渲染
            treeTable.render({
                elem: '#treeTable',
                id: TABLE_ID,
                url: server_url + '/system/menu/getMenuTree',
                method: 'post',
                headers: {
                    Authorization: token
                },
                contentType: 'application/json',
                where: buildWhere(),
                skin: 'line',
                cols: [[
                    {field: 'menuTitle', title: '菜单名称', width: 280},
                    {
                        title: '图标',
                        width: 80,
                        align: 'center',
                        templet: function (row) {
                            if (!row.menuIcon) {
                                return '-';
                            }
                            return '<i class="' + escapeHtml(safeMenuIcon(row.menuIcon)) + '"></i>';
                        }
                    },
                    {
                        title: '类型',
                        width: 90,
                        templet: function (row) {
                            const menuType = Number(row.menuType);
                            if (menuType === 1) {
                                return '<span class="yaya-tag yaya-tag-light-primary tag-small">目录</span>';
                            }
                            if (menuType === 2) {
                                return '<span class="yaya-tag yaya-tag-light-success tag-small">菜单</span>';
                            }
                            return '<span class="yaya-tag yaya-tag-light-warning tag-small">按钮</span>';
                        }
                    },
                    {field: 'perms', title: '权限标识', width: 180},
                    {field: 'menuUrl', title: '菜单地址', width: 240},
                    {field: 'sort', title: '排序', width: 70, align: 'center'},
                    {
                        title: '状态',
                        width: 80,
                        align: 'center',
                        templet: function (row) {
                            if (Number(row.status) === 1) {
                                return '<span class="yaya-tag yaya-tag-plain-success is-round tag-small">正常</span>';
                            }
                            return '<span class="yaya-tag yaya-tag-plain-danger is-round tag-small">停用</span>';
                        }
                    },
                    {
                        field: 'createByName',
                        title: '创建人',
                        width: 120,
                        templet: function (row) {
                            return escapeHtml(row.createByName) || '-';
                        }
                    },
                    {field: 'createTime', title: '创建时间', width: 180},
                    {field: 'updateTime', title: '更新时间', width: 180},
                    {
                        field: 'remark',
                        title: '备注',
                        minWidth: 180,
                        templet: function (row) {
                            return row.remark ? $('<div>').text(row.remark).html() : '-';
                        }
                    },
                    {
                        title: '操作',
                        fixed: 'right',
                        width: 280,
                        templet: function (row) {
                            const enabled = Number(row.status) === 1;
                            const actions = [{text: '编辑', event: 'edit', perm: 'menu:update'}];
                            // 按钮不能作为父菜单, 因此按钮行不提供新增下级入口
                            if (Number(row.menuType) !== 3) {
                                actions.push({text: '新增下级', event: 'addChild', perm: 'menu:add'});
                            }
                            actions.push({
                                text: enabled ? '停用' : '启用',
                                event: 'status',
                                perm: enabled ? 'menu:disable' : 'menu:enable',
                                className: 'yaya-btn is-link-success yaya-btn-small'
                            });
                            actions.push({
                                text: '删除', event: 'delete', perm: 'menu:del',
                                className: 'yaya-btn is-link-danger yaya-btn-small'
                            });
                            return window.yaya_permission_actions(actions);
                        }
                    }
                ]],
                tree: {
                    customName: {
                        id: 'menuId',
                        name: 'menuTitle',
                        icon: 'menuIcon'
                    },
                    view: {
                        expandAllDefault: false
                    }
                },
                page: false
            });

            /**
             * 打开新增/编辑页面
             */
            function openMenuForm(menuId, parentId) {
                let content;
                if (menuId) {
                    // 编辑使用独立页面
                    content = 'menu-edit.html?menuId=' + encodeURIComponent(menuId);
                } else {
                    // 新增/新增下级使用新增页面
                    content = 'menu-add.html';
                    if (parentId) {
                        content += '?parentId=' + encodeURIComponent(parentId);
                    }
                }
                layer.open({
                    type: 2,
                    title: menuId ? '编辑菜单' : '新增菜单',
                    // 高度留出上下间隙, 表单内容超出时在弹窗内滚动
                    area: ['640px', '80%'],
                    // 点击遮罩关闭弹窗
                    shadeClose: true,
                    content: content,
                    end: function () {
                        reloadTable();
                    }
                });
            }

            // 搜索
            $('#btnSearch').on('click', function () {
                reloadTable();
            });

            // 重置
            $('#btnReset').on('click', function () {
                $('#menuTitle').val('');
                $('#menuType').val('');
                $('#status').val('');
                form.render('select');
                reloadTable();
            });

            // 展开全部
            $('#btnExpandAll').on('click', function () {
                treeTable.expandAll(TABLE_ID, true);
            });

            // 收起全部
            $('#btnCollapseAll').on('click', function () {
                treeTable.expandAll(TABLE_ID, false);
            });

            // 新增
            $('#btnAdd').on('click', function () {
                openMenuForm();
            });

            // 行操作
            treeTable.on('tool(' + TABLE_ID + ')', function (obj) {
                const data = obj.data;
                if (obj.event === 'edit') {
                    openMenuForm(data.menuId);
                    return;
                }
                if (obj.event === 'addChild') {
                    openMenuForm(null, data.menuId);
                    return;
                }
                if (obj.event === 'status') {
                    const targetStatus = Number(data.status) === 1 ? 0 : 1;
                    const actionText = targetStatus === 1 ? '启用' : '停用';
                    layer.confirm('确定' + actionText + '菜单「' + escapeHtml(data.menuTitle) + '」吗？', {
                        title: '提示'
                    }, function (index) {
                        layer.close(index);
                        $.ajax({
                            url: server_url + '/system/menu/updateMenuStatus',
                            method: 'POST',
                            headers: {
                                Authorization: token
                            },
                            data: {
                                menuId: data.menuId,
                                status: targetStatus
                            },
                            dataType: 'json',
                            success: function (resp) {
                                layer.msg(resp.msg);
                                if (resp.code === 0) {
                                    reloadTable();
                                }
                            },
                            error: function () {
                                layer.msg('请求失败，请稍后重试');
                            }
                        });
                    });
                    return;
                }
                if (obj.event === 'delete') {
                    layer.confirm('确定删除菜单「' + escapeHtml(data.menuTitle) + '」吗？', {
                        title: '提示'
                    }, function (index) {
                        layer.close(index);
                        $.ajax({
                            url: server_url + '/system/menu/deleteMenu',
                            method: 'POST',
                            headers: {
                                Authorization: token
                            },
                            data: {
                                menuId: data.menuId
                            },
                            dataType: 'json',
                            success: function (resp) {
                                layer.msg(resp.msg);
                                if (resp.code === 0) {
                                    reloadTable();
                                }
                            },
                            error: function () {
                                layer.msg('请求失败，请稍后重试');
                            }
                        });
                    });
                }
            });
        });
    </script>
</body>
</html>
