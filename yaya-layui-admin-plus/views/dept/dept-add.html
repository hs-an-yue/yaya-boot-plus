<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <link rel="stylesheet" href="../../font/bootstrap-icons.css">
    <title>部门新增</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            overflow-y: auto;
        }
        .yaya-box-fluid {
            padding-bottom: 24px;
        }
        .layui-form-label {
            width: 100px;
        }
        .layui-input-block {
            margin-left: 130px;
        }
        #parentId, #parentId xm-select {
            width: 100%;
        }
        #parentId xm-select {
            box-sizing: border-box;
            border-radius: var(--yaya-radius-md);
        }
    </style>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="layui-fluid">
        <form class="layui-form" lay-filter="deptForm" style="margin-top: 10px;">
            <div class="layui-form-item">
                <label class="layui-form-label">上级部门</label>
                <div class="layui-input-block">
                    <div id="parentId"></div>
                    <input type="hidden" name="parentId" id="parentIdValue" value="0">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">部门名称</label>
                <div class="layui-input-block">
                    <input type="text" name="deptName" lay-verify="required" maxlength="200"
                           placeholder="请输入部门名称" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">部门编号</label>
                <div class="layui-input-block">
                    <input type="text" name="deptCode" lay-verify="required" maxlength="200"
                           placeholder="请输入部门编号" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">排序</label>
                <div class="layui-input-block">
                    <input type="number" name="sort" value="1" min="0" placeholder="请输入排序序号"
                           autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="正常" checked>
                    <input type="radio" name="status" value="0" title="停用">
                </div>
            </div>
            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" maxlength="500" placeholder="请输入备注" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" id="btnSave" data-perm="dept:add" class="yaya-btn yaya-primary" lay-submit lay-filter="save">保存</button>
                    <button type="button" class="yaya-btn" id="btnCancel" style="margin-left: 10px;">取消</button>
                </div>
            </div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script src="../../js/xm-select.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const layer = layui.layer;
        const form = layui.form;

        const prefilledParentId = new URLSearchParams(location.search).get('parentId');
        let deptTree = [];
        let treeLoaded = false;

        function disableSave() {
            $('#btnSave').prop('disabled', true).css('opacity', .5);
        }

        function buildDeptData(nodes) {
            return (nodes || []).map(function (node) {
                return {
                    name: node.deptName,
                    value: String(node.deptId),
                    children: buildDeptData(node.children)
                };
            });
        }

        function collectExpandedKeys(nodes, keys) {
            (nodes || []).forEach(function (node) {
                if (node.children && node.children.length > 0) {
                    keys.push(node.value);
                    collectExpandedKeys(node.children, keys);
                }
            });
            return keys;
        }

        function findDept(nodes, id) {
            for (const node of nodes || []) {
                if (String(node.deptId) === String(id)) {
                    return node;
                }
                const found = findDept(node.children, id);
                if (found) {
                    return found;
                }
            }
            return null;
        }

        function initForm() {
            if (!treeLoaded) {
                return;
            }
            const data = [{name: '顶级部门', value: '0'}].concat(buildDeptData(deptTree));
            const parentSelect = xmSelect.render({
                el: '#parentId',
                data: data,
                tree: {
                    show: true,
                    strict: false,
                    expandedKeys: collectExpandedKeys(data.slice(1), [])
                },
                radio: true,
                clickClose: true,
                filterable: true,
                tips: '请选择上级部门',
                theme: {
                    color: '#409eff'
                },
                on: function (selectData) {
                    const first = selectData.arr && selectData.arr[0];
                    $('#parentIdValue').val(first ? String(first.value) : '0');
                }
            });
            let selected = '0';
            if (prefilledParentId && findDept(deptTree, prefilledParentId)) {
                selected = String(prefilledParentId);
            }
            parentSelect.setValue([selected]);
            $('#parentIdValue').val(selected);
            form.render();
        }

        $.ajax({
            url: server_url + '/system/dept/getDeptTree',
            method: 'POST',
            contentType: 'application/json',
            headers: {
                Authorization: token
            },
            data: JSON.stringify({}),
            dataType: 'json',
            success: function (resp) {
                if (resp.code !== 0) {
                    disableSave();
                    layer.msg(resp.msg);
                    return;
                }
                deptTree = resp.data || [];
                treeLoaded = true;
                initForm();
            },
            error: function () {
                disableSave();
                layer.msg('部门数据加载失败，请稍后重试');
            }
        });

        function closeSelf() {
            if (parent && parent.layer && parent.layer.getFrameIndex) {
                const index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                return;
            }
            layer.closeAll();
        }

        $('#btnCancel').on('click', function () {
            closeSelf();
        });

        form.on('submit(save)', function (data) {
            const field = data.field;
            const payload = {
                deptName: $.trim(field.deptName),
                deptCode: $.trim(field.deptCode),
                parentId: field.parentId || '0',
                sort: field.sort === '' ? 1 : Number(field.sort),
                status: Number(field.status),
                remark: $.trim(field.remark || '')
            };

            const index = layer.load(0);
            $.ajax({
                url: server_url + '/system/dept/addDept',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: JSON.stringify(payload),
                dataType: 'json',
                success: function (resp) {
                    layer.close(index);
                    if (resp.code === 0) {
                        if (parent && parent.layer && parent.layer.msg) {
                            parent.layer.msg('新增成功');
                        } else {
                            layer.msg('新增成功');
                        }
                        closeSelf();
                    } else {
                        layer.msg(resp.msg);
                    }
                },
                error: function () {
                    layer.close(index);
                    layer.msg('请求失败，请稍后重试');
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
