<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <title>用户管理</title>
    <style>
        .yaya-user-layout {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .yaya-user-side {
            width: 230px;
            flex: 0 0 230px;
            padding: 0;
            overflow: hidden;
            position: sticky;
            top: 10px;
        }

        .yaya-user-side-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--yaya-card-border);
        }

        .yaya-user-side-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--yaya-text-1);
        }

        .yaya-user-side-all {
            border: 0;
            background: transparent;
            padding: 0;
            font-size: 12px;
            color: var(--yaya-primary);
            cursor: pointer;
        }

        .yaya-user-side-all:hover {
            color: var(--yaya-primary-hover);
        }

        .yaya-dept-search {
            position: relative;
            margin: 10px 12px 0;
        }

        .yaya-dept-search > .layui-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: var(--yaya-text-4);
            pointer-events: none;
        }

        .yaya-dept-search input {
            height: 32px;
            padding-left: 30px;
            border-radius: var(--yaya-radius-md);
            background: var(--yaya-gray-100);
        }

        #deptTree {
            padding: 8px 10px 14px;
            max-height: calc(100vh - 190px);
            overflow-y: auto;
        }

        .yaya-dept-empty {
            display: none;
            padding: 20px 12px;
            text-align: center;
            font-size: 12px;
            color: var(--yaya-text-4);
        }

        #deptTree .layui-tree-txt {
            font-size: 13px;
        }

        #deptTree .layui-tree-entry {
            min-height: 30px;
        }

        .yaya-user-side-tip {
            padding: 0 16px 12px;
            font-size: 12px;
            color: var(--yaya-text-4);
            line-height: 18px;
        }

        .yaya-user-main {
            flex: 1;
            min-width: 0;
        }

        .yaya-user-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            padding: 4px 0 12px;
        }

        .yaya-user-toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .yaya-dept-chip {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            font-size: 12px;
            color: var(--yaya-primary);
            background: var(--yaya-primary-bg);
            border: 1px solid var(--yaya-primary-border);
            border-radius: var(--yaya-radius-md);
        }

        .yaya-dept-chip.is-show {
            display: inline-flex;
        }

        .yaya-dept-chip .layui-icon {
            cursor: pointer;
            font-size: 12px;
            color: var(--yaya-primary);
        }

        .yaya-user-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            line-height: 1;
        }

        .yaya-user-avatar {
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--yaya-primary), #79bbff);
        }

        .yaya-user-meta {
            display: flex;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .yaya-user-name {
            flex: 0 0 auto;
            font-size: 13px;
            font-weight: 600;
            color: var(--yaya-text-1);
            white-space: nowrap;
        }

        .yaya-user-nick {
            min-width: 0;
            font-size: 12px;
            color: var(--yaya-text-4);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .yaya-name-list {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            max-width: 100%;
            overflow: hidden;
            vertical-align: middle;
        }

        .user-time-cell {
            display: flex;
            flex-direction: column;
            gap: 1px;
            font-size: 11px;
            line-height: 1.35;
            white-space: nowrap;
        }


        .yaya-name-list .yaya-tag {
            flex: 0 0 auto;
        }

        .yaya-empty-text {
            color: var(--yaya-text-4);
        }

        .yaya-op-group {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
        }

        .yaya-op-group .yaya-btn + .yaya-btn {
            margin-left: 0;
        }

        .yaya-root-protected {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--yaya-text-4);
            margin-right: 6px;
        }

        .yaya-reset-password-box {
            padding: 20px 22px 8px;
        }

        .yaya-reset-password-box .layui-form-item {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
        }

        .yaya-reset-password-box .layui-form-label {
            float: none;
            flex: 0 0 92px;
            width: 92px;
            height: 38px;
            line-height: 38px;
            padding: 0 12px 0 0;
            box-sizing: border-box;
            text-align: right;
        }

        .yaya-reset-password-box .layui-input-block {
            flex: 1 1 auto;
            min-width: 0;
            margin-left: 0;
        }

        .yaya-reset-password-hint {
            margin: 6px 0 0 92px;
            font-size: 12px;
            color: var(--yaya-text-4);
            line-height: 18px;
        }

        @media (max-width: 480px) {
            .yaya-reset-password-box {
                padding: 16px 16px 8px;
            }

            .yaya-reset-password-box .layui-form-item {
                display: block;
            }

            .yaya-reset-password-box .layui-form-label {
                width: auto;
                height: auto;
                line-height: 20px;
                padding: 0 0 6px;
                text-align: left;
            }

            .yaya-reset-password-hint {
                margin-left: 0;
            }
        }

        @media (max-width: 1100px) {
            .yaya-user-layout {
                flex-direction: column;
            }

            .yaya-user-side {
                width: 100%;
                flex-basis: auto;
                position: static;
            }

            #deptTree {
                max-height: 240px;
            }
        }
    </style>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="yaya-user-layout">
        <aside class="yaya-user-side yaya-panel">
            <div class="yaya-user-side-head">
                <span class="yaya-user-side-title">组织架构</span>
                <button type="button" class="yaya-user-side-all" id="btnDeptAll">全部部门</button>
            </div>
            <div class="yaya-dept-search">
                <i class="layui-icon layui-icon-search"></i>
                <input type="text" id="deptSearch" class="layui-input" placeholder="搜索部门" autocomplete="off">
            </div>
            <div id="deptTree"></div>
            <div class="yaya-dept-empty" id="deptEmpty">没有匹配的部门</div>
            <div class="yaya-user-side-tip">部门停用后用户将无法登录</div>
        </aside>

        <section class="yaya-user-main">
            <div class="yaya-panel">
                <form class="layui-form" style="padding: 10px 0" onsubmit="return false;">
                    <div class="layui-row">
                        <div class="layui-col-md3 layui-col-sm6 yaya-form-item">
                            <label class="yaya-form-label">用户名</label>
                            <div class="yaya-input-block">
                                <input type="text" id="username" placeholder="请输入用户名"
                                       autocomplete="off" class="layui-input yaya-input-border-radius">
                            </div>
                        </div>
                        <div class="layui-col-md3 layui-col-sm6 yaya-form-item">
                            <label class="yaya-form-label">昵称</label>
                            <div class="yaya-input-block">
                                <input type="text" id="nickname" placeholder="请输入昵称"
                                       autocomplete="off" class="layui-input yaya-input-border-radius">
                            </div>
                        </div>
                        <div class="layui-col-md2 layui-col-sm6 yaya-form-item">
                            <label class="yaya-form-label">状态</label>
                            <div class="yaya-input-block">
                                <select id="status">
                                    <option value="">全部</option>
                                    <option value="1">正常</option>
                                    <option value="0">禁用</option>
                                    <option value="2">锁定</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-col-md4 layui-col-sm6 yaya-form-item">
                            <div class="yaya-input-block" style="padding-left: 8px;">
                                <button type="button" id="btnSearch" data-perm="user:search" class="yaya-btn yaya-primary">搜索</button>
                                <button type="button" id="btnReset" class="yaya-btn" style="margin-left: 10px;">重置</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="yaya-panel" style="margin-top: 10px; padding: 12px 15px 15px;">
                <div class="yaya-user-toolbar">
                    <div class="yaya-dept-chip" id="deptFilterBar">
                        <span>当前部门：<b id="deptFilterText"></b></span>
                        <i class="layui-icon layui-icon-close-fill" id="btnClearDept" title="清除部门筛选"></i>
                    </div>
                    <div class="yaya-user-toolbar-actions">
                        <button type="button" id="btnAdd" data-perm="user:add" class="yaya-btn yaya-primary">
                            <i class="layui-icon layui-icon-addition" style="margin-right: 4px;"></i>新增用户
                        </button>
                        <button type="button" id="btnImport" data-perm="user:import" class="yaya-btn is-plain-success">
                            <i class="layui-icon layui-icon-upload-drag" style="margin-right: 4px;"></i>导入用户
                        </button>
                        <button type="button" id="btnExport" data-perm="user:export" class="yaya-btn is-plain-primary">
                            <i class="layui-icon layui-icon-export" style="margin-right: 4px;"></i>导出
                        </button>
                    </div>
                </div>
                <table class="layui-hide" id="table-user" lay-filter="table-user"></table>
            </div>
        </section>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const table = layui.table;
        const layer = layui.layer;
        const tree = layui.tree;
        const form = layui.form;

        const TABLE_ID = 'table-user';
        const BASE_URL = server_url + '/system/user';
        const canUpdateUser = window.hasAnyRole(['ROOT', 'OPERATION']);
        const PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue('--yaya-primary').trim() || '#409eff';

        let rootRoleId = '';
        let selectedDeptId = '';
        let selectedDeptName = '';
        let rawDeptData = [];
        let deptSearchTimer = null;

        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function dateTimeCell(value, emptyText) {
            if (!value) {
                return emptyText || '-';
            }
            const fullText = String(value);
            const shortText = fullText.length >= 16 ? fullText.substring(0, 16) : fullText;
            return '<span title="' + escapeHtml(fullText) + '">' + escapeHtml(shortText) + '</span>';
        }

        function createInfoCell(row) {
            const creator = escapeHtml(row.createByName) || '-';
            return '<div class="user-time-cell">'
                + '<div title="创建人：' + creator + '">' + creator + '</div>'
                + '<div>' + dateTimeCell(row.createTime) + '</div>'
                + '</div>';
        }

        function updateExpireCell(row) {
            return '<div class="user-time-cell">'
                + '<div>' + dateTimeCell(row.updateTime) + '</div>'
                + '<div>' + dateTimeCell(row.expiredTime, '长期有效') + '</div>'
                + '</div>';
        }

        function isRootUser(row) {
            if (!row) {
                return false;
            }
            if (String(row.username || '').toLowerCase() === 'root') {
                return true;
            }
            if (!rootRoleId || !Array.isArray(row.roleIds)) {
                return false;
            }
            return row.roleIds.some(function (roleId) {
                return String(roleId) === String(rootRoleId);
            });
        }

        function autoLockSeconds(row) {
            if (!row.autoLocked) {
                return 0;
            }
            if (row._autoLockDeadline) {
                return Math.max(0, Math.ceil((row._autoLockDeadline - Date.now()) / 1000));
            }
            return Math.max(0, Number(row.autoLockRemainingSeconds) || 0);
        }

        function formatAutoLockSeconds(seconds) {
            return seconds >= 60 ? Math.ceil(seconds / 60) + '分' : seconds + '秒';
        }

        function statusTag(row) {
            const value = Number(row.status);
            if (value === 2) {
                return '<span class="yaya-tag yaya-tag-plain-warning is-round tag-small">锁定</span>';
            }
            const autoSeconds = autoLockSeconds(row);
            if (autoSeconds > 0) {
                return '<span class="yaya-tag yaya-tag-plain-warning is-round tag-small" title="密码连续错误临时锁定，剩余 '
                    + formatAutoLockSeconds(autoSeconds) + '">临时锁定 '
                    + formatAutoLockSeconds(autoSeconds) + '</span>';
            }
            if (value === 0) {
                return '<span class="yaya-tag yaya-tag-plain-danger is-round tag-small">禁用</span>';
            }
            if (row.expiredTime) {
                const time = new Date(String(row.expiredTime).replace(/-/g, '/')).getTime();
                if (!Number.isNaN(time) && time < Date.now()) {
                    return '<span class="yaya-tag yaya-tag-plain-danger is-round tag-small" title="过期时间：'
                        + escapeHtml(row.expiredTime) + '">已过期</span>';
                }
            }
            return '<span class="yaya-tag yaya-tag-plain-success is-round tag-small">正常</span>';
        }

        function userCell(row) {
            const nickname = row.nickname || row.username || '';
            const initial = String(nickname).trim().charAt(0) || '?';
            const rootTag = isRootUser(row)
                ? '<span class="yaya-tag yaya-tag-plain-warning is-round tag-small" style="margin-left:4px;">ROOT</span>'
                : '';
            return '<div class="yaya-user-cell">'
                + '<span class="yaya-user-avatar">' + escapeHtml(initial) + '</span>'
                + '<span class="yaya-user-meta">'
                + '<span class="yaya-user-name" title="' + escapeHtml(row.username) + '">'
                + escapeHtml(row.username || '-') + '</span>'
                + '<span class="yaya-user-nick" title="' + escapeHtml(row.nickname) + '">'
                + escapeHtml(row.nickname || '-') + '</span>'
                + rootTag
                + '</span>'
                + '</div>';
        }

        function namesCell(names, type) {
            const list = (Array.isArray(names) ? names : []).map(String);
            if (list.length === 0) {
                return '<span class="yaya-empty-text">-</span>';
            }
            const max = 2;
            const shown = list.slice(0, max);
            const tagClass = type === 'post' ? 'yaya-tag-light-info' : 'yaya-tag-light-primary';
            let html = '<span class="yaya-name-list" title="' + escapeHtml(list.join('、')) + '">';
            html += shown.map(function (name) {
                return '<span class="yaya-tag ' + tagClass + ' is-round tag-small">'
                    + escapeHtml(name) + '</span>';
            }).join('');
            if (list.length > max) {
                html += '<span class="yaya-tag yaya-tag-plain-info is-round tag-small">+'
                    + (list.length - max) + '</span>';
            }
            return html + '</span>';
        }

        function operationCell(row) {
            if (isRootUser(row)) {
                const disabledStyle = 'opacity:.45;cursor:not-allowed;';
                return '<span class="yaya-root-protected"><i class="layui-icon layui-icon-set-fill"></i>受保护</span>'
                    + '<button type="button" class="yaya-btn yaya-btn-small" disabled style="' + disabledStyle + '">编辑</button>'
                    + '<button type="button" class="yaya-btn yaya-btn-small" disabled style="' + disabledStyle + ';margin-left:4px;">重置密码</button>'
                    + '<button type="button" class="yaya-btn yaya-btn-small" disabled style="' + disabledStyle + ';margin-left:4px;">删除</button>';
            }
            let actions = [
                {text: '编辑', event: 'edit', allowed: canUpdateUser, title: '仅 ROOT 或 OPERATION 角色可编辑用户'},
                {text: '重置密码', event: 'resetPwd', perm: 'user:reset', className: 'yaya-btn is-link-warning yaya-btn-small'}
            ];
            const status = Number(row.status);
            if (status === 1) {
                if (autoLockSeconds(row) > 0) {
                    actions.push({
                        text: '解除临时锁', event: 'unlock', perm: 'user:unlock',
                        className: 'yaya-btn is-link-success yaya-btn-small'
                    });
                }
                actions.push({
                    text: '禁用', event: 'disable', perm: 'user:disable',
                    className: 'yaya-btn is-link-danger yaya-btn-small'
                });
                if (autoLockSeconds(row) <= 0) {
                    actions.push({
                        text: '锁定', event: 'lock', perm: 'user:disable',
                        className: 'yaya-btn is-link-warning yaya-btn-small'
                    });
                }
            } else if (status === 0) {
                actions.push({
                    text: '启用', event: 'enable', perm: 'user:enable',
                    className: 'yaya-btn is-link-success yaya-btn-small'
                });
            } else if (status === 2) {
                actions.push({
                    text: '解锁', event: 'unlock', perm: 'user:unlock',
                    className: 'yaya-btn is-link-success yaya-btn-small'
                });
            }
            actions.push({
                text: '删除', event: 'delete', perm: 'user:del',
                className: 'yaya-btn is-link-danger yaya-btn-small'
            });
            return window.yaya_permission_actions(actions);
        }

        function buildWhere() {
            const where = {};
            const username = $.trim($('#username').val());
            const nickname = $.trim($('#nickname').val());
            const status = $('#status').val();
            if (username) {
                where.username = username;
            }
            if (nickname) {
                where.nickname = nickname;
            }
            if (status !== '') {
                where.status = Number(status);
            }
            if (selectedDeptId) {
                where.deptId = selectedDeptId;
            }
            return where;
        }

        function updateDeptChip() {
            if (selectedDeptId) {
                $('#deptFilterBar').addClass('is-show');
                $('#deptFilterText').text(selectedDeptName || selectedDeptId);
            } else {
                $('#deptFilterBar').removeClass('is-show');
                $('#deptFilterText').text('');
            }
        }

        function reloadTable() {
            table.reload(TABLE_ID, {
                where: buildWhere(),
                page: {
                    curr: 1,
                    prev: '上一页',
                    next: '下一页',
                    theme: PRIMARY
                }
            });
        }

        function renderTable() {
            table.render({
                elem: '#table-user',
                id: TABLE_ID,
                url: BASE_URL + '/getUserPage',
                method: 'post',
                headers: {
                    Authorization: token
                },
                contentType: 'application/json',
                request: {
                    pageName: 'pageNum',
                    limitName: 'pageSize'
                },
                where: buildWhere(),
                parseData: function (res) {
                    const records = (res.data && res.data.records) || [];
                    records.forEach(function (row) {
                        const seconds = Number(row.autoLockRemainingSeconds);
                        row._autoLockDeadline = row.autoLocked && seconds > 0
                            ? Date.now() + seconds * 1000
                            : null;
                    });
                    return {
                        code: res.code,
                        msg: res.msg,
                        count: (res.data && res.data.total) || 0,
                        data: records
                    };
                },
                skin: 'line',
                page: {
                    prev: '上一页',
                    next: '下一页',
                    theme: PRIMARY
                },
                limit: 10,
                limits: [10, 20, 50],
                defaultToolbar: [],
                cols: [[
                    {title: '用户', minWidth: 200, templet: userCell},
                    {
                        field: 'deptName',
                        title: '部门',
                        width: 200,
                        templet: function (row) {
                            return escapeHtml(row.deptName) || '-';
                        }
                    },
                    {
                        field: 'phone',
                        title: '手机号',
                        width: 120,
                        templet: function (row) {
                            return escapeHtml(row.phone) || '-';
                        }
                    },
                    {
                        field: 'status',
                        title: '状态',
                        width: 130,
                        align: 'center',
                        templet: function (row) {
                            return statusTag(row);
                        }
                    },
                    {
                        title: '角色',
                        width: 125,
                        templet: function (row) {
                            return namesCell(row.roleNames, 'role');
                        }
                    },
                    {
                        title: '岗位',
                        width: 85,
                        templet: function (row) {
                            return namesCell(row.postNames, 'post');
                        }
                    },
                    {
                        title: '创建人/创建时间',
                        width: 155,
                        templet: createInfoCell
                    },
                    {
                        title: '更新时间/过期时间',
                        width: 155,
                        templet: updateExpireCell
                    },
                    {
                        title: '操作',
                        fixed: 'right',
                        width: 350,
                        templet: operationCell
                    }
                ]]
            });
        }

        let autoLockReloading = false;

        function refreshAutoLockCells() {
            if (document.hidden) {
                return;
            }
            const rows = (table.cache && table.cache[TABLE_ID]) || [];
            const trs = document.querySelectorAll('.layui-table-main tbody tr');
            let hasExpired = false;
            trs.forEach(function (tr, index) {
                const row = rows[index];
                if (!row || !row.autoLocked) {
                    return;
                }
                const cell = tr.querySelector('td[data-field="status"] .layui-table-cell')
                    || tr.querySelector('td[data-field="status"]');
                if (cell) {
                    cell.innerHTML = statusTag(row);
                }
                if (autoLockSeconds(row) <= 0) {
                    hasExpired = true;
                }
            });
            // 临时锁定到期后重新拉取列表, 同步操作按钮和最新状态
            if (hasExpired && !autoLockReloading) {
                autoLockReloading = true;
                setTimeout(function () {
                    autoLockReloading = false;
                    reloadTable();
                }, 300);
            }
        }

        function normalizeDeptData(nodes) {
            return (nodes || []).map(function (node) {
                const disabled = Number(node.status) !== 1;
                return {
                    deptId: String(node.deptId),
                    deptName: node.deptName + (disabled ? '（停用）' : ''),
                    spread: true,
                    children: normalizeDeptData(node.children)
                };
            });
        }

        function filterDeptData(nodes, keyword) {
            const result = [];
            (nodes || []).forEach(function (node) {
                const children = filterDeptData(node.children, keyword);
                const matched = String(node.deptName || '').toLowerCase().includes(keyword);
                if (matched || children.length > 0) {
                    result.push({
                        deptId: node.deptId,
                        deptName: node.deptName,
                        spread: true,
                        children: matched ? node.children : children
                    });
                }
            });
            return result;
        }

        function renderDeptTree(nodes) {
            const keyword = $.trim($('#deptSearch').val()).toLowerCase();
            const normalized = normalizeDeptData(nodes);
            const filtered = keyword ? filterDeptData(normalized, keyword) : normalized;
            const data = [{
                deptId: '',
                deptName: '全部部门',
                spread: true,
                children: filtered
            }];
            $('#deptEmpty').toggle(keyword !== '' && filtered.length === 0);
            $('#deptTree').empty();
            tree.render({
                elem: '#deptTree',
                data: data,
                showLine: false,
                onlyIconControl: false,
                customName: {
                    id: 'deptId',
                    title: 'deptName',
                    children: 'children'
                },
                click: function (obj) {
                    selectedDeptId = String(obj.data.deptId || '');
                    selectedDeptName = selectedDeptId ? String(obj.data.deptName || '') : '';
                    updateDeptChip();
                    reloadTable();
                }
            });
        }

        function loadDeptTree() {
            $.ajax({
                url: server_url + '/system/dept/getDeptTree',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: '{}',
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        layer.msg(resp.msg);
                        return;
                    }
                    rawDeptData = resp.data || [];
                    renderDeptTree(rawDeptData);
                },
                error: function () {
                    layer.msg('部门数据加载失败，请稍后重试');
                }
            });
        }

        function loadRootRole(callback) {
            $.ajax({
                url: server_url + '/system/role/getRoleList',
                method: 'POST',
                headers: {
                    Authorization: token
                },
                dataType: 'json',
                success: function (resp) {
                    if (resp.code === 0) {
                        const rootRole = (resp.data || []).find(function (role) {
                            return String(role.roleCode || '').toUpperCase() === 'ROOT';
                        });
                        rootRoleId = rootRole ? String(rootRole.roleId) : '';
                    }
                    callback();
                },
                error: callback
            });
        }

        function openAdd() {
            layer.open({
                type: 2,
                title: '新增用户',
                area: ['820px', '88%'],
                shadeClose: true,
                content: 'user-add.html',
                end: reloadTable
            });
        }

        function openEdit(userId) {
            if (!canUpdateUser) {
                layer.msg('仅 ROOT 或 OPERATION 角色可编辑用户');
                return;
            }
            layer.open({
                type: 2,
                title: '编辑用户',
                area: ['820px', '88%'],
                shadeClose: true,
                content: 'user-edit.html?userId=' + encodeURIComponent(userId),
                end: reloadTable
            });
        }

        function openImport() {
            layer.open({
                type: 2,
                title: '导入用户',
                area: ['820px', '82%'],
                shadeClose: true,
                content: 'user-import.html',
                end: reloadTable
            });
        }

        function changeStatus(row, targetStatus, actionText, extraMessage) {
            const message = '确定' + actionText + '用户「' + escapeHtml(row.username) + '」吗？'
                + (extraMessage || '');
            layer.confirm(message, {title: '提示'}, function (index) {
                layer.close(index);
                $.ajax({
                    url: BASE_URL + '/updateUserStatus',
                    method: 'POST',
                    headers: {
                        Authorization: token
                    },
                    data: {
                        userId: row.userId,
                        status: targetStatus
                    },
                    dataType: 'json',
                    success: function (resp) {
                        layer.msg(resp.msg);
                        if (resp.code === 0) {
                            reloadTable();
                        }
                    },
                    error: function () {
                        layer.msg('请求失败，请稍后重试');
                    }
                });
            });
        }

        function unlockUser(row) {
            const action = autoLockSeconds(row) > 0 ? '解除临时登录锁定' : '解锁';
            layer.confirm('确定' + action + '用户「' + escapeHtml(row.username) + '」吗？', {
                title: '提示'
            }, function (index) {
                layer.close(index);
                $.ajax({
                    url: BASE_URL + '/unlockUser',
                    method: 'POST',
                    headers: {
                        Authorization: token
                    },
                    data: {
                        userId: row.userId
                    },
                    dataType: 'json',
                    success: function (resp) {
                        layer.msg(resp.msg);
                        if (resp.code === 0) {
                            reloadTable();
                        }
                    },
                    error: function () {
                        layer.msg('请求失败，请稍后重试');
                    }
                });
            });
        }

        function deleteUser(row) {
            layer.confirm('确定删除用户「' + escapeHtml(row.username) + '」吗？删除后该用户将无法登录，角色和岗位关联会一并清理。', {
                title: '提示',
                btn: ['确定删除', '取消']
            }, function (index) {
                layer.close(index);
                $.ajax({
                    url: BASE_URL + '/deleteUser',
                    method: 'POST',
                    headers: {
                        Authorization: token
                    },
                    data: {
                        userId: row.userId
                    },
                    dataType: 'json',
                    success: function (resp) {
                        layer.msg(resp.msg);
                        if (resp.code === 0) {
                            reloadTable();
                        }
                    },
                    error: function () {
                        layer.msg('请求失败，请稍后重试');
                    }
                });
            });
        }

        function resetPassword(row) {
            // 页面可能运行在较窄的 iframe 中, 固定 440px 会溢出, 这里按可用宽度收敛
            const dialogWidth = Math.min(440, Math.max(280, window.innerWidth - 32));
            const html = '<div class="yaya-reset-password-box layui-form">'
                + '<div class="layui-form-item">'
                + '<label class="layui-form-label">新密码</label>'
                + '<div class="layui-input-block">'
                + '<input type="password" id="resetPassword" autocomplete="new-password" '
                + 'placeholder="请输入新密码" class="layui-input">'
                + '</div>'
                + '</div>'
                + '<div class="layui-form-item">'
                + '<label class="layui-form-label">确认密码</label>'
                + '<div class="layui-input-block">'
                + '<input type="password" id="resetPasswordConfirm" autocomplete="new-password" '
                + 'placeholder="请再次输入新密码" class="layui-input">'
                + '</div>'
                + '</div>'
                + '<div class="yaya-reset-password-hint">重置后该用户当前登录会话会立即失效，需要使用新密码重新登录。</div>'
                + '</div>';
            layer.open({
                type: 1,
                title: '重置密码 - ' + escapeHtml(row.username),
                area: [dialogWidth + 'px', 'auto'],
                content: html,
                btn: ['确定重置', '取消'],
                yes: function (index) {
                    const password = $('#resetPassword').val();
                    const confirmPassword = $('#resetPasswordConfirm').val();
                    if (!password) {
                        layer.msg('请输入新密码');
                        return;
                    }
                    if (password.length > 200) {
                        layer.msg('密码不能超过200个字符');
                        return;
                    }
                    if (password !== confirmPassword) {
                        layer.msg('两次输入的密码不一致');
                        return;
                    }
                    const loading = layer.load(0);
                    $.ajax({
                        url: BASE_URL + '/resetUserPassword',
                        method: 'POST',
                        contentType: 'application/json',
                        headers: {
                            Authorization: token
                        },
                        data: JSON.stringify({
                            userId: row.userId,
                            password: password
                        }),
                        dataType: 'json',
                        success: function (resp) {
                            layer.close(loading);
                            if (resp.code === 0) {
                                layer.close(index);
                                layer.msg('密码重置成功');
                            } else {
                                layer.msg(resp.msg);
                            }
                        },
                        error: function () {
                            layer.close(loading);
                            layer.msg('请求失败，请稍后重试');
                        }
                    });
                }
            });
        }

        function exportUsers() {
            const loading = layer.load(0);
            fetch(server_url + '/system/user/exportUser', {
                method: 'POST',
                headers: {
                    Authorization: token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(buildWhere())
            }).then(async function (res) {
                const contentType = res.headers.get('content-type') || '';
                if (!res.ok || contentType.includes('application/json')) {
                    let message = '导出失败，请稍后重试';
                    try {
                        const json = await res.json();
                        message = json.msg || message;
                    } catch (e) {
                        // ignore parse error
                    }
                    throw new Error(message);
                }
                const blob = await res.blob();
                const disposition = res.headers.get('content-disposition') || '';
                let filename = '用户数据.xlsx';
                const utf8Match = /filename\*=UTF-8''([^;]+)/i.exec(disposition);
                const plainMatch = /filename="?([^";]+)"?/i.exec(disposition);
                if (utf8Match) {
                    filename = decodeURIComponent(utf8Match[1]);
                } else if (plainMatch) {
                    filename = plainMatch[1];
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                layer.close(loading);
                layer.msg('导出成功');
            }).catch(function (error) {
                layer.close(loading);
                layer.msg(error.message || '导出失败，请稍后重试');
            });
        }

        $('#deptSearch').on('input', function () {
            clearTimeout(deptSearchTimer);
            deptSearchTimer = setTimeout(function () {
                renderDeptTree(rawDeptData);
            }, 200);
        });

        $('#btnSearch').on('click', reloadTable);
        $('#btnReset').on('click', function () {
            $('#username').val('');
            $('#nickname').val('');
            $('#status').val('');
            form.render('select');
            selectedDeptId = '';
            selectedDeptName = '';
            updateDeptChip();
            reloadTable();
        });
        $('#btnDeptAll').on('click', function () {
            selectedDeptId = '';
            selectedDeptName = '';
            updateDeptChip();
            reloadTable();
        });
        $('#btnClearDept').on('click', function () {
            selectedDeptId = '';
            selectedDeptName = '';
            updateDeptChip();
            reloadTable();
        });
        $('#btnAdd').on('click', openAdd);
        $('#btnImport').on('click', openImport);
        $('#btnExport').on('click', exportUsers);

        table.on('tool(' + TABLE_ID + ')', function (obj) {
            const row = obj.data;
            if (isRootUser(row)) {
                return;
            }
            switch (obj.event) {
                case 'edit':
                    openEdit(row.userId);
                    break;
                case 'resetPwd':
                    resetPassword(row);
                    break;
                case 'disable':
                    changeStatus(row, 0, '禁用', '禁用后该用户将无法登录。');
                    break;
                case 'enable':
                    changeStatus(row, 1, '启用');
                    break;
                case 'lock':
                    changeStatus(row, 2, '锁定', '锁定后该用户将无法登录。');
                    break;
                case 'unlock':
                    unlockUser(row);
                    break;
                case 'delete':
                    deleteUser(row);
                    break;
            }
        });

        loadDeptTree();
        loadRootRole(function () {
            renderTable();
            setInterval(refreshAutoLockCells, 1000);
        });
    });
</script>
</body>
</html>
