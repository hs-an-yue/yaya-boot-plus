<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <title>用户编辑</title>
    <style>
        html, body {
            height: 100%;
        }

        html {
            background: #fafbfc;
        }

        body {
            overflow-y: auto;
            background: #fafbfc;
            background-color: #fafbfc !important;
        }

        .yaya-box-fluid {
            padding-bottom: 26px;
        }

        .yaya-form-card {
            margin-top: 12px;
            padding: 4px 20px 18px;
            background: var(--yaya-card);
            border: 1px solid var(--yaya-card-border);
            border-radius: var(--yaya-radius-lg);
            box-shadow: var(--yaya-shadow);
        }

        .yaya-form-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 0 12px;
            margin-bottom: 4px;
            border-bottom: 1px dashed var(--yaya-border);
        }

        .yaya-form-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--yaya-text-1);
        }

        .yaya-form-card-title::before {
            content: '';
            width: 3px;
            height: 14px;
            border-radius: 2px;
            background: var(--yaya-primary);
        }

        .yaya-form-card-sub {
            font-size: 12px;
            color: var(--yaya-text-4);
        }

        .yaya-root-tip {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            border: 1px solid var(--yaya-warning-border);
            border-radius: var(--yaya-radius-md);
            background: var(--yaya-warning-bg);
            color: var(--yaya-warning);
            font-size: 13px;
            line-height: 20px;
        }

        .yaya-root-tip.is-show {
            display: block;
        }

        .layui-form-label {
            width: 90px;
            padding: 9px 10px 9px 0;
            color: var(--yaya-text-2);
        }

        .layui-input-block {
            margin-left: 100px;
        }

        .yaya-form-hint {
            margin-top: 4px;
            font-size: 12px;
            color: var(--yaya-text-4);
            line-height: 18px;
        }

        .yaya-required {
            color: var(--yaya-danger);
            margin-right: 2px;
        }

        #deptSelect .xm-select,
        #roleSelect .xm-select,
        #postSelect .xm-select {
            width: 100%;
            min-height: 38px;
            border-radius: var(--yaya-radius-md);
        }

        .yaya-form-grid {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -6px;
        }

        .yaya-form-grid > .layui-col-xs12 {
            width: 100%;
            padding: 0 6px;
            box-sizing: border-box;
        }

        .yaya-form-grid > .layui-col-sm6 {
            width: 50%;
            padding: 0 6px;
            box-sizing: border-box;
        }

        .yaya-form-actions {
            position: sticky;
            bottom: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
            padding: 12px 10px 14px;
            background: rgba(250, 251, 252, .96);
            border-top: 1px solid var(--yaya-border);
            backdrop-filter: blur(4px);
        }

        .yaya-form-actions .yaya-btn {
            min-width: 96px;
        }

        .yaya-btn.is-loading {
            opacity: .65;
            cursor: wait;
        }

        @media (max-width: 767px) {
            .yaya-form-card {
                padding-left: 14px;
                padding-right: 14px;
            }

            .yaya-form-grid > .layui-col-sm6 {
                width: 100%;
            }

            .layui-form-label {
                width: 82px;
            }

            .layui-input-block {
                margin-left: 92px;
            }
        }
    </style>
</head>
<body>
<div class="yaya-box-fluid">
    <div class="layui-fluid">
        <form class="layui-form" lay-filter="userForm">
            <input type="hidden" name="userId">
            <div class="yaya-root-tip" id="rootTip">
                ROOT 账户受保护：用户管理不允许修改 ROOT 账户的资料、角色、密码、状态，也不允许删除。
            </div>

            <div class="yaya-form-card">
                <div class="yaya-form-card-head">
                    <div class="yaya-form-card-title">基本信息</div>
                    <div class="yaya-form-card-sub" id="userMeta">用户信息加载中...</div>
                </div>
                <div class="yaya-form-grid">
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">用户名</label>
                            <div class="layui-input-block">
                                <input type="text" name="username" disabled class="layui-input layui-disabled">
                                <div class="yaya-form-hint">用户名创建后不可修改</div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="yaya-required">*</span>昵称</label>
                            <div class="layui-input-block">
                                <input type="text" name="nickname" lay-verify="required" maxlength="100"
                                       lay-reqtext="请输入昵称" placeholder="请输入昵称"
                                       autocomplete="off" class="layui-input">
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">手机号</label>
                            <div class="layui-input-block">
                                <input type="text" name="phone" maxlength="100" placeholder="请输入手机号"
                                       autocomplete="off" class="layui-input">
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">邮箱</label>
                            <div class="layui-input-block">
                                <input type="text" name="email" lay-verify="email" maxlength="100"
                                       placeholder="请输入邮箱" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">性别</label>
                            <div class="layui-input-block">
                                <input type="radio" name="sex" value="1" title="男">
                                <input type="radio" name="sex" value="0" title="女">
                                <input type="radio" name="sex" value="2" title="保密">
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="yaya-required">*</span>所属部门</label>
                            <div class="layui-input-block">
                                <div id="deptSelect"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="yaya-form-card">
                <div class="yaya-form-card-head">
                    <div class="yaya-form-card-title">权限与有效期</div>
                    <div class="yaya-form-card-sub">修改角色/部门后该用户需重新登录</div>
                </div>
                <div class="yaya-form-grid">
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">过期时间</label>
                            <div class="layui-input-block">
                                <input type="text" name="expiredTime" id="expiredTime" readonly
                                       placeholder="留空表示长期有效" autocomplete="off" class="layui-input">
                                <div class="yaya-form-hint">到期后用户无法登录</div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12 layui-col-sm6">
                        <div class="layui-form-item">
                            <label class="layui-form-label">密码</label>
                            <div class="layui-input-block">
                                <div class="yaya-form-hint" style="margin-top:0;padding-top:9px;">
                                    如需修改密码，请返回列表页操作
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12">
                        <div class="layui-form-item">
                            <label class="layui-form-label"><span class="yaya-required">*</span>角色</label>
                            <div class="layui-input-block">
                                <div id="roleSelect"></div>
                                <div class="yaya-form-hint">ROOT 角色不可分配；角色为必选项，请至少选择一个角色</div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs12">
                        <div class="layui-form-item">
                            <label class="layui-form-label">岗位</label>
                            <div class="layui-input-block">
                                <div id="postSelect"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="yaya-form-card">
                <div class="yaya-form-card-head">
                    <div class="yaya-form-card-title">补充信息</div>
                </div>
                <div class="layui-form-item layui-form-text" style="margin-top: 14px;">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea name="remark" maxlength="500" placeholder="请输入备注"
                                  class="layui-textarea"></textarea>
                    </div>
                </div>
            </div>

            <div class="yaya-form-actions">
                <button type="button" class="yaya-btn" id="btnCancel">取消</button>
                <button type="button" id="btnSave" data-role-any="ROOT,OPERATION" class="yaya-btn yaya-primary is-loading"
                        lay-submit lay-filter="save" disabled>信息加载中...</button>
            </div>
        </form>
    </div>
</div>
<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script src="../../js/xm-select.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const layer = layui.layer;
        const form = layui.form;
        const laydate = layui.laydate;
        const canUpdateUser = window.hasAnyRole(['ROOT', 'OPERATION']);

        const PRIMARY = getComputedStyle(document.documentElement)
            .getPropertyValue('--yaya-primary').trim() || '#409eff';
                const userId = new URLSearchParams(location.search).get('userId');

        let userInfo = null;
        let rootRoleId = '';
        let isRootAccount = false;
        let deptData = [];
        let roleData = [];
        let postData = [];
        let deptSelect = null;
        let roleSelect = null;
        let postSelect = null;
        let finalized = false;
        const loaded = {
            user: false,
            dept: false,
            roles: false,
            posts: false
        };

        function closeSelf() {
            if (parent && parent.layer && parent.layer.getFrameIndex) {
                const index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                return;
            }
            layer.closeAll();
        }

        function finish(message) {
            if (parent && parent.layer && parent.layer.msg) {
                parent.layer.msg(message);
            } else {
                layer.msg(message);
            }
            closeSelf();
        }

        function selectFailed(name) {
            $('#btnSave').prop('disabled', true).addClass('is-loading').text(name + '加载失败');
            layer.msg(name + '数据加载失败，请重新打开页面');
        }

        function buildDeptData(nodes) {
            return (nodes || []).map(function (node) {
                const disabled = Number(node.status) !== 1;
                return {
                    name: node.deptName + (disabled ? '（停用）' : ''),
                    value: String(node.deptId),
                    children: buildDeptData(node.children)
                };
            });
        }

        function collectExpandedKeys(nodes, keys) {
            (nodes || []).forEach(function (node) {
                if (node.children && node.children.length > 0) {
                    keys.push(node.value);
                    collectExpandedKeys(node.children, keys);
                }
            });
            return keys;
        }

        function renderSelectors() {
            if (!deptSelect) {
                deptSelect = xmSelect.render({
                    el: '#deptSelect',
                    data: deptData,
                    radio: true,
                    clickClose: true,
                    filterable: true,
                    tips: '请选择所属部门',
                    tree: {
                        show: true,
                        strict: false,
                        expandedKeys: collectExpandedKeys(deptData, [])
                    },
                    theme: {
                        color: PRIMARY
                    }
                });
            }
            if (!roleSelect) {
                roleSelect = xmSelect.render({
                    el: '#roleSelect',
                    data: roleData,
                    filterable: true,
                    tips: '请选择角色（必选）',
                    theme: {
                        color: PRIMARY
                    }
                });
            }
            if (!postSelect) {
                postSelect = xmSelect.render({
                    el: '#postSelect',
                    data: postData,
                    filterable: true,
                    tips: '请选择岗位（可不选）',
                    theme: {
                        color: PRIMARY
                    }
                });
            }
            window.userDeptSelect = deptSelect;
            window.userRoleSelect = roleSelect;
            window.userPostSelect = postSelect;
        }

        function applyUserValues() {
            form.val('userForm', {
                userId: String(userInfo.userId),
                username: userInfo.username || '',
                nickname: userInfo.nickname || '',
                phone: userInfo.phone || '',
                email: userInfo.email || '',
                sex: String(userInfo.sex == null ? 1 : userInfo.sex),
                expiredTime: userInfo.expiredTime || '',
                remark: userInfo.remark || ''
            });
            form.render('radio');
            deptSelect.setValue(userInfo.deptId ? [String(userInfo.deptId)] : []);
            roleSelect.setValue((userInfo.roleIds || []).map(String));
            postSelect.setValue((userInfo.postIds || []).map(String));
            $('#userMeta').text('用户ID：' + userInfo.userId + ' · 状态：' + statusText(userInfo.status));
        }

        function statusText(status) {
            const value = Number(status);
            if (value === 1) {
                return '正常';
            }
            if (value === 2) {
                return '锁定';
            }
            return '禁用';
        }

        function disableForm() {
            $('form.layui-form').find('input,textarea,button').prop('disabled', true);
            $('.xm-select').addClass('is-disabled').css('pointer-events', 'none').css('opacity', .7);
            $('#btnSave').hide();
            $('#btnCancel').prop('disabled', false);
        }

        function finalize() {
            if (finalized || !loaded.user || !loaded.dept || !loaded.roles || !loaded.posts) {
                return;
            }
            finalized = true;
            renderSelectors();
            applyUserValues();
            const roleIds = (userInfo.roleIds || []).map(String);
            isRootAccount = String(userInfo.username || '').toLowerCase() === 'root'
                || (rootRoleId !== '' && roleIds.includes(String(rootRoleId)));
            if (isRootAccount) {
                $('#rootTip').addClass('is-show');
                disableForm();
                return;
            }
            $('#btnSave').prop('disabled', false).removeClass('is-loading').text('保存');
        }

        function loadUser() {
            if (!userId) {
                layer.msg('缺少用户ID');
                $('#btnSave').prop('disabled', true).text('参数错误');
                return;
            }
            $.ajax({
                url: server_url + '/system/user/getUserDetail',
                method: 'POST',
                headers: {
                    Authorization: token
                },
                data: {
                    userId: userId
                },
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        selectFailed('用户');
                        return;
                    }
                    userInfo = resp.data;
                    loaded.user = true;
                    finalize();
                },
                error: function () {
                    selectFailed('用户');
                }
            });
        }

        function loadDept() {
            $.ajax({
                url: server_url + '/system/dept/getDeptTree',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: '{}',
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        selectFailed('部门');
                        return;
                    }
                    deptData = buildDeptData(resp.data || []);
                    loaded.dept = true;
                    finalize();
                },
                error: function () {
                    selectFailed('部门');
                }
            });
        }

        function loadRoles() {
            $.ajax({
                url: server_url + '/system/role/getRoleList',
                method: 'POST',
                headers: {
                    Authorization: token
                },
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        selectFailed('角色');
                        return;
                    }
                    const roles = resp.data || [];
                    const rootRole = roles.find(function (role) {
                        return String(role.roleCode || '').toUpperCase() === 'ROOT';
                    });
                    rootRoleId = rootRole ? String(rootRole.roleId) : '';
                    roleData = roles
                        .filter(function (role) {
                            return String(role.roleCode || '').toUpperCase() !== 'ROOT';
                        })
                        .map(function (role) {
                            const disabled = Number(role.status) !== 1;
                            return {
                                name: role.roleName + (disabled ? '（已停用）' : ''),
                                value: String(role.roleId)
                            };
                        });
                    loaded.roles = true;
                    finalize();
                },
                error: function () {
                    selectFailed('角色');
                }
            });
        }

        function loadPosts() {
            $.ajax({
                url: server_url + '/system/post/getPostList',
                method: 'POST',
                headers: {
                    Authorization: token
                },
                dataType: 'json',
                success: function (resp) {
                    if (resp.code !== 0) {
                        selectFailed('岗位');
                        return;
                    }
                    postData = (resp.data || []).map(function (post) {
                        const disabled = Number(post.status) !== 1;
                        return {
                            name: post.postName + (disabled ? '（已停用）' : ''),
                            value: String(post.postId)
                        };
                    });
                    loaded.posts = true;
                    finalize();
                },
                error: function () {
                    selectFailed('岗位');
                }
            });
        }

        laydate.render({
            elem: '#expiredTime',
            type: 'datetime',
            theme: PRIMARY,
            trigger: 'click'
        });

        $('#btnCancel').on('click', closeSelf);

        form.on('submit(save)', function (data) {
            if (!canUpdateUser) {
                layer.msg('仅 ROOT 或 OPERATION 角色可编辑用户');
                return false;
            }
            if (isRootAccount) {
                layer.msg('ROOT 账户不允许通过用户管理修改');
                return false;
            }
            if (!finalized) {
                layer.msg('用户信息尚未加载完成，请稍候');
                return false;
            }
            const deptIds = deptSelect ? (deptSelect.getValue('value') || []) : [];
            if (deptIds.length === 0) {
                layer.msg('请选择所属部门');
                return false;
            }
            const field = data.field;
            const selectedRoleIds = roleSelect ? (roleSelect.getValue('value') || []) : [];
            if (selectedRoleIds.length === 0) {
                layer.msg('角色不能为空');
                return false;
            }
            const payload = {
                userId: String(userInfo.userId),
                username: userInfo.username,
                nickname: $.trim(field.nickname),
                phone: $.trim(field.phone || '') || null,
                email: $.trim(field.email || '') || null,
                sex: Number(field.sex == null ? 1 : field.sex),
                deptId: String(deptIds[0]),
                expiredTime: $.trim(field.expiredTime || '') || null,
                remark: $.trim(field.remark || '') || null,
                roleIds: selectedRoleIds.map(String),
                postIds: postSelect ? (postSelect.getValue('value') || []).map(String) : []
            };
            const loading = layer.load(0);
            $.ajax({
                url: server_url + '/system/user/updateUser',
                method: 'POST',
                contentType: 'application/json',
                headers: {
                    Authorization: token
                },
                data: JSON.stringify(payload),
                dataType: 'json',
                success: function (resp) {
                    layer.close(loading);
                    if (resp.code === 0) {
                        finish('保存成功');
                    } else {
                        layer.msg(resp.msg);
                    }
                },
                error: function () {
                    layer.close(loading);
                    layer.msg('请求失败，请稍后重试');
                }
            });
            return false;
        });

        if (!canUpdateUser) {
            disableForm();
            layer.msg('仅 ROOT 或 OPERATION 角色可编辑用户');
            return;
        }
        loadUser();
        loadDept();
        loadRoles();
        loadPosts();
    });
</script>
</body>
</html>
