<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改密码</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--yaya-text-1);
            background: var(--yaya-bg);
        }

        .password-page {
            min-height: 100vh;
            padding: 18px;
        }

        .password-card {
            background: var(--yaya-card);
            border: 1px solid var(--yaya-border);
            border-radius: 14px;
            box-shadow: var(--yaya-shadow);
            overflow: hidden;
        }

        .password-head {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 56px 18px 20px;
            border-bottom: 1px solid var(--yaya-border);
        }

        .window-close {
            position: absolute;
            top: 15px;
            right: 16px;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            color: var(--yaya-text-4);
            background: transparent;
            cursor: pointer;
            transition: all .16s ease;
        }

        .window-close:hover {
            color: var(--yaya-text-2);
            background: var(--yaya-hover);
        }

        .password-head-icon {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            color: var(--yaya-warning);
            background: var(--yaya-warning-bg);
            font-size: 19px;
        }

        .password-head h2 {
            margin: 0;
            font-size: 16px;
            line-height: 1.4;
        }

        .password-head p {
            margin: 3px 0 0;
            font-size: 12px;
            color: var(--yaya-text-3);
        }

        .password-body {
            padding: 20px 20px 4px;
        }

        .layui-form-label {
            width: 72px;
            padding: 9px 8px 9px 0;
            font-size: 12px;
            color: var(--yaya-text-2);
        }

        .layui-input-block {
            margin-left: 72px;
            min-height: 38px;
        }

        .layui-input {
            height: 38px;
            border-color: var(--yaya-border);
            border-radius: 7px;
            font-size: 12px;
        }

        .layui-input:focus {
            border-color: var(--yaya-primary) !important;
        }

        .layui-input-prefix .layui-icon,
        .layui-input-prefix .bi {
            color: var(--yaya-text-4);
        }

        .password-tip {
            margin: 0 0 14px;
            padding: 9px 11px;
            border-radius: 7px;
            color: var(--yaya-text-3);
            background: var(--yaya-warning-bg);
            font-size: 12px;
            line-height: 1.6;
        }

        .password-tip i {
            margin-right: 5px;
            color: var(--yaya-warning);
        }

        .password-rules {
            margin: 2px 0 6px 72px;
            padding: 0;
            list-style: none;
            font-size: 11px;
            color: var(--yaya-text-4);
            line-height: 1.8;
        }

        .password-rules li i {
            margin-right: 4px;
            color: var(--yaya-success);
        }

        .password-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px 18px;
            border-top: 1px solid var(--yaya-border);
        }

        .password-actions .yaya-btn {
            min-width: 78px;
        }
    </style>
</head>
<body>
<div class="password-page">
    <div class="password-card">
        <div class="password-head">
            <div class="password-head-icon"><i class="bi bi-shield-lock"></i></div>
            <div>
                <h2>修改密码</h2>
                <p>验证原密码后设置新的登录密码</p>
            </div>
            <button type="button" class="window-close" id="btnClose" title="关闭">
                <i class="layui-icon layui-icon-close"></i>
            </button>
        </div>

        <form class="layui-form" lay-filter="passwordForm" id="passwordForm">
            <div class="password-body">
                <p class="password-tip"><i class="bi bi-exclamation-triangle"></i>密码修改成功后，当前登录状态会立即失效，需要使用新密码重新登录。</p>
                <div class="layui-form-item">
                    <label class="layui-form-label">原密码</label>
                    <div class="layui-input-block">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix"><i class="bi bi-shield-lock"></i></div>
                            <input type="password" name="oldPassword" id="oldPassword"
                                   placeholder="请输入原密码" autocomplete="current-password"
                                   class="layui-input" lay-verify="required" lay-reqtext="请输入原密码"
                                   lay-affix="eye">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">新密码</label>
                    <div class="layui-input-block">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix"><i class="bi bi-shield-check"></i></div>
                            <input type="password" name="newPassword" id="newPassword"
                                   placeholder="请输入新密码" autocomplete="new-password"
                                   class="layui-input" lay-verify="required" lay-reqtext="请输入新密码"
                                   lay-affix="eye">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">确认密码</label>
                    <div class="layui-input-block">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix"><i class="bi bi-shield-fill-check"></i></div>
                            <input type="password" name="confirmPassword" id="confirmPassword"
                                   placeholder="请再次输入新密码" autocomplete="new-password"
                                   class="layui-input" lay-verify="required" lay-reqtext="请再次输入新密码"
                                   lay-affix="eye">
                        </div>
                    </div>
                </div>
                <ul class="password-rules">
                    <li><i class="bi bi-check2"></i>两次输入的新密码必须一致</li>
                    <li><i class="bi bi-check2"></i>新密码不能与原密码相同</li>
                </ul>
            </div>
            <div class="password-actions">
                <button type="button" class="yaya-btn" id="btnCancel">取消</button>
                <button type="button" class="yaya-btn yaya-primary" id="btnSave"
                        lay-submit lay-filter="save">确认修改</button>
            </div>
        </form>
    </div>
</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const form = layui.form;
        const layer = layui.layer;

        function closeSelf() {
            if (window.parent && window.parent.layer && window.parent.layer.getFrameIndex) {
                const index = window.parent.layer.getFrameIndex(window.name);
                if (index) {
                    window.parent.layer.close(index);
                    return;
                }
            }
            window.location.href = 'personal-center.html';
        }

        function setSaving(saving) {
            $('#btnSave')
                .prop('disabled', saving)
                .toggleClass('is-loading', saving)
                .text(saving ? '提交中...' : '确认修改');
        }

        function redirectToLogin() {
            const loginUrl = new URL('../../login.html', window.location.href).href;
            layui.data('yaya', null);
            // 密码已变化, 清除登录页保存的旧密码凭据, 避免下次回填失效密码
            localStorage.removeItem('yaya_login_remember_v1');
            try {
                window.top.location.replace(loginUrl);
            } catch (e) {
                window.location.replace(loginUrl);
            }
        }

        form.on('submit(save)', function (data) {
            const field = data.field;
            if (field.newPassword !== field.confirmPassword) {
                layer.msg('两次输入的新密码不一致');
                return false;
            }
            if (field.oldPassword === field.newPassword) {
                layer.msg('新密码不能与原密码相同');
                return false;
            }
            setSaving(true);
            $.ajax({
                type: 'POST',
                url: server_url + '/system/personal/updatePassword',
                headers: {Authorization: token},
                contentType: 'application/json',
                data: JSON.stringify({
                    oldPassword: field.oldPassword,
                    newPassword: field.newPassword,
                    confirmPassword: field.confirmPassword
                }),
                dataType: 'json',
                success: function (response) {
                    if (response.code === 0) {
                        layer.msg('密码修改成功，请重新登录', {icon: 1, time: 1200}, redirectToLogin);
                    } else {
                        setSaving(false);
                        layer.msg(response.msg || '密码修改失败');
                    }
                },
                error: function () {
                    setSaving(false);
                    layer.msg('密码修改失败，请稍后重试');
                }
            });
            return false;
        });

        $('#btnCancel').on('click', closeSelf);
        $('#btnClose').on('click', closeSelf);
    });
</script>
</body>
</html>
