<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑个人资料</title>
    <link rel="stylesheet" href="../../layui/css/layui.css">
    <link rel="stylesheet" href="../../font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/yaya-common.css">
    <link rel="stylesheet" href="../../css/yaya-style-extend.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            color: var(--yaya-text-1);
            background: var(--yaya-bg);
        }

        .edit-page {
            height: 100%;
            padding: 16px;
        }

        .edit-card {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--yaya-card);
            border: 1px solid var(--yaya-border);
            border-radius: 14px;
            box-shadow: var(--yaya-shadow);
            overflow: hidden;
        }

        .edit-head {
            position: relative;
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 56px 16px 20px;
            border-bottom: 1px solid var(--yaya-border);
        }

        .window-close {
            position: absolute;
            top: 15px;
            right: 16px;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            color: var(--yaya-text-4);
            background: transparent;
            cursor: pointer;
            transition: all .16s ease;
        }

        .window-close:hover {
            color: var(--yaya-text-2);
            background: var(--yaya-hover);
        }

        .edit-head-icon {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            color: var(--yaya-primary);
            background: var(--yaya-primary-bg);
            font-size: 19px;
        }

        .edit-head h2 {
            margin: 0;
            font-size: 16px;
            line-height: 1.4;
        }

        .edit-head p {
            margin: 3px 0 0;
            font-size: 12px;
            color: var(--yaya-text-3);
        }

        .edit-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px 20px 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 14px;
        }

        .form-grid .is-full {
            grid-column: 1 / -1;
        }

        .layui-form-label {
            width: 72px;
            padding: 9px 8px 9px 0;
            font-size: 12px;
            color: var(--yaya-text-2);
        }

        .layui-input-block {
            margin-left: 72px;
            min-height: 36px;
        }

        .layui-input,
        .layui-select {
            height: 36px;
            border-color: var(--yaya-border);
            border-radius: 7px;
            font-size: 12px;
        }

        .layui-input:focus,
        .layui-form-select dl {
            border-color: var(--yaya-primary);
        }

        .layui-input[disabled] {
            color: var(--yaya-text-3);
            background: var(--yaya-gray-100);
            cursor: not-allowed;
        }

        .layui-form-radio > i:hover,
        .layui-form-radioed > i {
            color: var(--yaya-primary);
        }

        .form-tip {
            margin: 0 0 12px;
            padding: 9px 11px;
            border-radius: 7px;
            color: var(--yaya-text-3);
            background: var(--yaya-gray-100);
            font-size: 12px;
            line-height: 1.6;
        }

        .form-tip i {
            margin-right: 5px;
            color: var(--yaya-primary);
        }

        .edit-actions {
            flex: none;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 13px 20px 15px;
            border-top: 1px solid var(--yaya-border);
            background: var(--yaya-card);
        }

        .edit-actions .yaya-btn {
            min-width: 78px;
        }

        @media (max-width: 560px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="edit-page">
    <div class="edit-card">
        <div class="edit-head">
            <div class="edit-head-icon"><i class="bi bi-person-vcard"></i></div>
            <div>
                <h2>编辑个人资料</h2>
                <p>修改昵称、手机号、邮箱和性别</p>
            </div>
            <button type="button" class="window-close" id="btnClose" title="关闭">
                <i class="layui-icon layui-icon-close"></i>
            </button>
        </div>

        <form class="layui-form" lay-filter="personalEditForm" id="personalEditForm">
            <div class="edit-body">
                <p class="form-tip"><i class="bi bi-info-circle"></i>账号、部门和角色由管理员维护，个人中心不能修改。</p>
                <div class="form-grid">
                    <div class="layui-form-item is-full">
                        <label class="layui-form-label">用户账号</label>
                        <div class="layui-input-block">
                            <input type="text" id="accountInput" class="layui-input" disabled>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">昵称</label>
                        <div class="layui-input-block">
                            <input type="text" name="nickname" id="nicknameInput" maxlength="100"
                                   placeholder="请输入昵称" autocomplete="off"
                                   class="layui-input" lay-verify="required">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">所属部门</label>
                        <div class="layui-input-block">
                            <input type="text" id="deptInput" class="layui-input" disabled
                                   title="部门由管理员维护，如需调整请联系管理员">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机号</label>
                        <div class="layui-input-block">
                            <input type="text" name="phone" id="phoneInput" maxlength="100"
                                   placeholder="请输入手机号" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">邮箱</label>
                        <div class="layui-input-block">
                            <input type="text" name="email" id="emailInput" maxlength="100"
                                   placeholder="请输入邮箱" autocomplete="off"
                                   class="layui-input" lay-verify="email">
                        </div>
                    </div>
                    <div class="layui-form-item is-full">
                        <label class="layui-form-label">性别</label>
                        <div class="layui-input-block">
                            <input type="radio" name="sex" value="1" title="男">
                            <input type="radio" name="sex" value="0" title="女">
                            <input type="radio" name="sex" value="2" title="保密">
                        </div>
                    </div>
                </div>
            </div>
            <div class="edit-actions">
                <button type="button" class="yaya-btn" id="btnCancel">取消</button>
                <button type="button" class="yaya-btn yaya-primary" id="btnSave"
                        lay-submit lay-filter="save" disabled>加载中...</button>
            </div>
        </form>
    </div>
</div>

<script src="../../layui/layui.js"></script>
<script src="../../js/server.js"></script>
<script>
    layui.use(function () {
        const $ = layui.$;
        const form = layui.form;
        const layer = layui.layer;
        let profile = null;

        function closeSelf() {
            if (window.parent && window.parent.layer && window.parent.layer.getFrameIndex) {
                const index = window.parent.layer.getFrameIndex(window.name);
                if (index) {
                    window.parent.layer.close(index);
                    return;
                }
            }
            window.location.href = 'personal-center.html';
        }

        function setSaving(saving) {
            $('#btnSave')
                .prop('disabled', saving)
                .toggleClass('is-loading', saving)
                .text(saving ? '保存中...' : '保存修改');
        }

        function loadFailed(message) {
            layer.msg(message || '页面加载失败');
            $('#btnSave').text('加载失败');
        }

        function renderProfile(data) {
            profile = data;
            $('#accountInput').val(data.username || '');
            $('#nicknameInput').val(data.nickname || '');
            $('#phoneInput').val(data.phone || '');
            $('#emailInput').val(data.email || '');
            $('#deptInput').val(data.deptName || '-');
            const sex = data.sex == null ? 1 : Number(data.sex);
            $('input[name="sex"][value="' + sex + '"]').prop('checked', true);
            form.render('radio');
        }

        $.ajax({
            type: 'POST',
            url: server_url + '/system/personal/getProfile',
            headers: {Authorization: token},
            contentType: 'application/json',
            data: '{}',
            dataType: 'json',
            success: function (response) {
                if (response.code === 0) {
                    renderProfile(response.data || {});
                    setSaving(false);
                } else {
                    loadFailed(response.msg);
                }
            },
            error: function () {
                loadFailed('个人资料加载失败');
            }
        });

        form.on('submit(save)', function (data) {
            const payload = {
                nickname: $.trim(data.field.nickname),
                phone: $.trim(data.field.phone || '') || null,
                email: $.trim(data.field.email || '') || null,
                sex: Number(data.field.sex)
            };
            setSaving(true);
            $.ajax({
                type: 'POST',
                url: server_url + '/system/personal/updateProfile',
                headers: {Authorization: token},
                contentType: 'application/json',
                data: JSON.stringify(payload),
                dataType: 'json',
                success: function (response) {
                    if (response.code === 0) {
                        layer.msg('个人资料已更新', {icon: 1, time: 800}, function () {
                            closeSelf();
                        });
                    } else {
                        setSaving(false);
                        layer.msg(response.msg || '保存失败');
                    }
                },
                error: function () {
                    setSaving(false);
                    layer.msg('保存失败，请稍后重试');
                }
            });
            return false;
        });

        $('#btnCancel').on('click', closeSelf);
        $('#btnClose').on('click', closeSelf);
    });
</script>
</body>
</html>
